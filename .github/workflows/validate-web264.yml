name: Validate all Kitabcha web tests without deployment
permissions:
  contents: read
  actions: read
concurrency:
  group: web264-full-test-audit
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        specs:
          - slow-network-stock barcode-scanner quotations online-only people-activity recovery-reload web-startup team-identity notification-settings business-assets
            trade-editor-ui record-payment-mode theme-speed bahij-web transaction-receipts team-access
            screen-recovery refresh-interruption auth landing mobile-keyboard background-saves
            mobile-responsive ledger
          - readable-export backup-restore contact-input-ui push-notifications creator-ui payment-pane
            website-language reset-backup more-hub mobile-back bill-actions profile-stock-premium pane-drafts
            forms-refresh pre-signin-language
          - sale-visibility-units access-recovery navigation-expiry plan-tiers marketing-v3 landing-masthead app-language-ux rtl-layout-parity customer-proof-motion
            reset-cache-boundaries book-deletion accounts-workspace qa-report-flows qa-receipt-policy
          - people-entry-layout rejected-record-recovery help-center team-viewer onboarding-prefill
            notification-inbox input-direction bill-confirmation cashbook records-toolbars website-pages switcher-animations books book-switch-performance transaction-drafts
            financial-reports people-currency-selection report-attachments form-experience ui-polish interaction-motion workspace-followups ux-navigation-followups
          - otp-ui form-enter setup-otp-enter account-contact landing-faq list-hover otp-auto quotation-header support-layout ui-feedback-regressions report-reminder-follow-up report-consistency
          - app-recovery billing-emails compact-home current-ui-fixes dashboard grocery-audit home-picker loading-version otp-email paging people-layout referral reports-navigation scale-loading scale-reports scale-validation ux-clarity
    env:
      CI: "1"
      SOURCE_SHA: 8b00eec8cb0a1f32f590c7be280b706f3bf80947
      KITABCHA_BUILD_VERSION: v3.7.264
      EXPO_PUBLIC_API_URL: http://localhost:3001
      SPECS: ${{ matrix.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: 8b00eec8cb0a1f32f590c7be280b706f3bf80947
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          fetch-depth: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Select reachable signed Ubuntu archive
        run: |
          set -euo pipefail
          mirror=''
          for base in https://mirrors.edge.kernel.org/ubuntu https://mirror.math.princeton.edu/pub/ubuntu https://mirrors.mit.edu/ubuntu; do
            if curl --fail --silent --show-error --head --connect-timeout 5 --max-time 15 "$base/dists/jammy/InRelease" >/dev/null 2>&1 && curl --fail --silent --show-error --head --connect-timeout 5 --max-time 15 "$base/dists/jammy-security/InRelease" >/dev/null 2>&1; then
              mirror="$base"
              break
            fi
          done
          test -n "$mirror"
          echo "Selected reachable Ubuntu archive: $mirror"
          sudo python3 - "$mirror" <<'PY'
          from pathlib import Path
          import re, sys
          base = sys.argv[1]
          for path in [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/apt-mirrors-security.txt')]:
              if path.is_file():
                  path.write_text(base + '/\n')
          paths = [Path('/etc/apt/sources.list')]
          paths += list(Path('/etc/apt/sources.list.d').glob('*.list')) + list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          for path in paths:
              if path.is_file():
                  original = path.read_text()
                  updated = re.sub(r'https?://(?:[A-Za-z0-9.-]*archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?', base + '/', original)
                  if updated != original:
                      path.write_text(updated)
          PY
          timeout 240 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update > "$RUNNER_TEMP/ubuntu-mirror.log" 2>&1
      - name: Install browser validation dependencies
        run: |-
          npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/browser-install.log" 2>&1
          npm run db:generate > "$RUNNER_TEMP/browser-prisma.log" 2>&1
      - name: Install pinned Caddy for receipt policy regression
        if: contains(matrix.specs, 'qa-receipt-policy')
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 --silent --show-error --header "Accept: application/octet-stream" "https://api.github.com/repos/caddyserver/caddy/releases/assets/711594947?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT" -o caddy_2.11.9_linux_amd64.tar.gz || \
          curl --fail --location --retry 3 --silent --show-error https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_amd64.tar.gz -o caddy_2.11.9_linux_amd64.tar.gz

          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 --silent --show-error --header "Accept: application/octet-stream" "https://api.github.com/repos/caddyserver/caddy/releases/assets/711595488?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT" -o caddy_checksums.txt || \
          curl --fail --location --retry 3 --silent --show-error https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_checksums.txt -o caddy_checksums.txt

          echo '5b8cb7faf8726a2028ad96a66e54e6e81e8f361bc6175e5d22bbd997cc5177fb  caddy_2.11.9_linux_amd64.tar.gz' | sha256sum --check --status
          grep ' caddy_2.11.9_linux_amd64.tar.gz$' caddy_checksums.txt | sha512sum --check --status
          tar -xzf caddy_2.11.9_linux_amd64.tar.gz caddy
          chmod 700 caddy
          echo "CADDY_EXECUTABLE=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"
      - name: Validate plans, owner dashboard, permissions and existing browser flows
        run: >
          set -euo pipefail

          npx playwright install --with-deps chromium > "$RUNNER_TEMP/validation-browser-install.log" 2>&1

          EXPO_PUBLIC_API_URL=http://localhost:3001 GITHUB_SHA="$SOURCE_SHA" npm run build:web >
          "$RUNNER_TEMP/validation-web.log" 2>&1

          failures=0

          passed=0

          for spec in $SPECS; do
            echo "Checking $spec in an isolated test server."
            if npx playwright test "tests/e2e/$spec.spec.ts" > "$RUNNER_TEMP/validation-browser-$spec.log" 2>&1; then
              echo "PASSED $spec"
              passed=$((passed + 1))
            else
              echo "FAILED $spec; private diagnostics retained on runner."
              failures=$((failures + 1))
            fi
          done

          echo "Browser audit complete: $passed passed; $failures failed."

          test "$failures" -eq 0

          echo 'Owner notifications, invoice links, team access and expiry browser checks passed.'
      - name: Encrypt private failure diagnostics
        if: failure()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |-
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const logs={};for(const name of fs.readdirSync(process.env.RUNNER_TEMP).filter(n=>n.endsWith('.log'))){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.statSync(p).isFile())logs[name]=fs.readFileSync(p,'utf8').slice(-1500000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(logs)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'web264audit-diagnostic.enc'),JSON.stringify(sealed));console.log('Private diagnostics encrypted for the local decryption key.');
          NODE
      - name: Upload encrypted diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web264audit-browser-${{ strategy.job-index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/web264audit-diagnostic.enc
          retention-days: 2
          if-no-files-found: ignore
  unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CI: "1"
      SOURCE_SHA: 8b00eec8cb0a1f32f590c7be280b706f3bf80947
      DEPLOY_VERSION: v3.7.264
      KITABCHA_BUILD_VERSION: v3.7.264
      EXPO_PUBLIC_API_URL: https://app.kitabcha.app
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: 8b00eec8cb0a1f32f590c7be280b706f3bf80947
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          fetch-depth: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Select reachable signed Ubuntu archive
        run: |
          set -euo pipefail
          mirror=''
          for base in https://mirrors.edge.kernel.org/ubuntu https://mirror.math.princeton.edu/pub/ubuntu https://mirrors.mit.edu/ubuntu; do
            if curl --fail --silent --show-error --head --connect-timeout 5 --max-time 15 "$base/dists/jammy/InRelease" >/dev/null 2>&1 && curl --fail --silent --show-error --head --connect-timeout 5 --max-time 15 "$base/dists/jammy-security/InRelease" >/dev/null 2>&1; then
              mirror="$base"
              break
            fi
          done
          test -n "$mirror"
          echo "Selected reachable Ubuntu archive: $mirror"
          sudo python3 - "$mirror" <<'PY'
          from pathlib import Path
          import re, sys
          base = sys.argv[1]
          for path in [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/apt-mirrors-security.txt')]:
              if path.is_file():
                  path.write_text(base + '/\n')
          paths = [Path('/etc/apt/sources.list')]
          paths += list(Path('/etc/apt/sources.list.d').glob('*.list')) + list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          for path in paths:
              if path.is_file():
                  original = path.read_text()
                  updated = re.sub(r'https?://(?:[A-Za-z0-9.-]*archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?', base + '/', original)
                  if updated != original:
                      path.write_text(updated)
          PY
          timeout 240 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update > "$RUNNER_TEMP/ubuntu-mirror.log" 2>&1
      - name: Validate private source without publishing logs
        run: >
          set -euo pipefail

          echo "Installing validation dependencies"

          npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/validation-install.log" 2>&1

          npx playwright install --with-deps chromium > "$RUNNER_TEMP/unit-browser-install.log" 2>&1

          echo "Generating database client"

          npm run db:generate > "$RUNNER_TEMP/validation-prisma.log" 2>&1

          echo "Checking types"

          npm run typecheck > "$RUNNER_TEMP/validation-types.log" 2>&1

          echo "Checking lint"

          npm run lint > "$RUNNER_TEMP/validation-lint.log" 2>&1

          for pattern in 'tests/*.test.ts' 'tests/*.test.mjs'; do
            if [[ "$pattern" == *'.test.ts' ]]; then
              command=(node --import tsx --test --test-reporter=tap --test-concurrency=2 --test-timeout=120000)
            else
              command=(node --test --test-reporter=tap)
            fi
            echo "Running $pattern"
            if ! "${command[@]}" $pattern > "$RUNNER_TEMP/validation-tests.log" 2>&1; then
              python3 - <<'PYTEST'
          import pathlib,os,re

          log=pathlib.Path(os.environ['RUNNER_TEMP'],'validation-tests.log').read_text()

          for line in log.splitlines():
           if re.match(r'^\s*(not ok|# (tests|pass|fail|skipped)|error:)',line):print(line[:300])
          PYTEST
              exit 1
            fi
            grep -E '^# (tests|pass|fail|skipped)' "$RUNNER_TEMP/validation-tests.log" || true
          done

          if ! node tests/admin-backup-ui-smoke.mjs > "$RUNNER_TEMP/owner-backup-browser.log" 2>&1; then
            echo 'Owner backup browser regression failed; private diagnostics retained on runner.'
            exit 1
          fi

          echo 'Owner encrypted backup download, upload review and restore browser gate passed.'

          if ! node tests/react-admin-owner-ui-smoke.mjs > "$RUNNER_TEMP/owner-console-browser.log" 2>&1; then
            echo 'Owner console security, restore and Drive browser regression failed; private diagnostics retained on runner.'
            exit 1
          fi

          echo 'Owner console security, scoped restore, storage and B2 configuration browser gate passed.'

          if ! node --import tsx --test tests/browser/bill-preview.test.ts > "$RUNNER_TEMP/bill-preview-browser.log" 2>&1; then
            echo 'Bill preview browser regression failed; private diagnostics retained on runner.'
            exit 1
          fi

          echo 'Types, lint, full API/unit and session/owner/native regressions passed.'


          if ! node tests/react-admin-owner-ui-smoke.mjs > "$RUNNER_TEMP/react-admin-browser.log" 2>&1; then
            echo 'React-admin backup and recovery browser regression failed; private diagnostics retained on runner.'
            exit 1
          fi

          echo 'React-admin desktop/mobile, selected/all deletion, upload restore and deleted-account recovery
          passed.'
      - name: Encrypt private failure diagnostics
        if: failure()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |-
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const logs={};for(const name of fs.readdirSync(process.env.RUNNER_TEMP).filter(n=>n.endsWith('.log'))){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.statSync(p).isFile())logs[name]=fs.readFileSync(p,'utf8').slice(-1500000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(logs)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'web264audit-diagnostic.enc'),JSON.stringify(sealed));console.log('Private diagnostics encrypted for the local decryption key.');
          NODE
      - name: Upload encrypted diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web264audit-unit-${{ strategy.job-index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/web264audit-diagnostic.enc
          retention-days: 2
          if-no-files-found: ignore
  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: 8b00eec8cb0a1f32f590c7be280b706f3bf80947
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
      - name: Verify isolated PostgreSQL backup and restore
        run: |-
          set -euo pipefail
          python3 scripts/verify-postgres-recovery.py > "$RUNNER_TEMP/recovery.log" 2>&1
          echo "Isolated PostgreSQL backup and restore gate passed."
      - name: Encrypt private failure diagnostics
        if: failure()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |-
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const logs={};for(const name of fs.readdirSync(process.env.RUNNER_TEMP).filter(n=>n.endsWith('.log'))){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.statSync(p).isFile())logs[name]=fs.readFileSync(p,'utf8').slice(-1500000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(logs)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'web264audit-diagnostic.enc'),JSON.stringify(sealed));console.log('Private diagnostics encrypted for the local decryption key.');
          NODE
      - name: Upload encrypted diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web264audit-recovery-${{ strategy.job-index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/web264audit-diagnostic.enc
          retention-days: 2
          if-no-files-found: ignore
on:
  workflow_dispatch: null
