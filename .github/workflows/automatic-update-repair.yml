name: Automatic security update diagnosis and repair
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [diagnose, fix, verify]
      plan_digest:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: production-web-v3-release
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 8f72aab2efecd11ceca20bf7cbfe04a0c04c0ff6
      MODE: ${{ inputs.mode }}
      PLAN_DIGEST: ${{ inputs.plan_digest }}
    steps:
      - name: Validate and execute bounded maintenance
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-before.json"
          mkdir -p "$RUNNER_TEMP/probe/deploy"
          cat > "$RUNNER_TEMP/probe/deploy/security.sh" <<'SECURITY_SCRIPT'
          #!/bin/bash
          set -Eeuo pipefail
          mode=${1:-diagnose}
          echo "MODE=$mode"
          if [[ "$mode" == diagnose ]]; then
            sudo -n python3 - <<'PY'
          import pathlib,subprocess,re
          def show(args):
              r=subprocess.run(args,text=True,capture_output=True,timeout=90)
              print('$ '+' '.join(args));print(r.stdout[-18000:]);print('EXIT',r.returncode)
          show(['systemctl','show','apt-daily.service','apt-daily-upgrade.service','-p','Result','-p','ExecMainStartTimestamp','-p','ExecMainExitTimestamp','-p','ExecMainStatus','-p','ConditionResult'])
          show(['systemctl','cat','apt-daily.service','apt-daily-upgrade.service','apt-daily.timer','apt-daily-upgrade.timer'])
          show(['journalctl','-u','apt-daily.service','-u','apt-daily-upgrade.service','--since','2026-11-04','--no-pager','-n','70'])
          show(['apt-config','dump'])
          for name in ['update-stamp','download-upgradeable-stamp','upgrade-stamp','unattended-upgrades-stamp']:
              p=pathlib.Path('/var/lib/apt/periodic')/name
              print('STAMP',name,p.stat().st_mtime if p.exists() else None)
          p=pathlib.Path('/var/log/unattended-upgrades/unattended-upgrades.log')
          if p.exists():
              print('UNATTENDED_LOG');print('\n'.join(p.read_text(errors='replace').splitlines()[-100:]))
          p=pathlib.Path('/usr/lib/apt/apt.systemd.daily')
          text=p.read_text();print('DAILY_INTERVAL_CODE')
          lines=text.splitlines()
          for a,b in [(0,180),(350,550)]: print('\n'.join(f'{i+1}: {s}' for i,s in enumerate(lines) if a<=i<b))
          PY
          fi
          SECURITY_SCRIPT
          printf '%s\n' '#!/bin/bash' 'set -Eeuo pipefail' 'bash "$(dirname "$0")/security.sh" diagnose' > "$RUNNER_TEMP/probe/deploy/release.sh"
          tar -czf "$RUNNER_TEMP/probe.tar.gz" -C "$RUNNER_TEMP/probe" .
          sum=$(sha256sum "$RUNNER_TEMP/probe.tar.gz" | cut -d' ' -f1)
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "v0.0.$GITHUB_RUN_ID $SOURCE_SHA $sum" < "$RUNNER_TEMP/probe.tar.gz" > "$RUNNER_TEMP/aggregate.json" 2> "$RUNNER_TEMP/probe-error.log"
          for i in {1..5}; do
            curl --fail -sS --max-time 20 -o /dev/null -w '%{http_code} %{time_connect} %{time_starttransfer} %{time_total}\n' https://app.kitabcha.app/health >> "$RUNNER_TEMP/runner-timings.txt"
          done
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-after.json"
          node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP;const a=JSON.parse(fs.readFileSync(p+"/marker-before.json")),b=JSON.parse(fs.readFileSync(p+"/marker-after.json"));if(a.commit!==b.commit||a.version!==b.version)process.exit(1);console.log("Maintenance completed; deployed application version unchanged.");'
      - name: Encrypt private diagnostic output
        if: always()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const files={};for(const name of ['aggregate.json','probe-error.log','ops-tests.log','runner-timings.txt','marker-before.json','marker-after.json']){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.existsSync(p))files[name]=fs.readFileSync(p,'utf8').slice(-2000000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(files)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'automatic-update-repair.enc'),JSON.stringify(sealed));console.log('Aggregate diagnostics encrypted for private analysis.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-update-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/automatic-update-repair.enc
          retention-days: 1
          if-no-files-found: error
