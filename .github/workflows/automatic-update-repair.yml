name: Automatic security update diagnosis and repair
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [diagnose, fix, verify, finish]
      plan_digest:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: production-web-v3-release
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 8f72aab2efecd11ceca20bf7cbfe04a0c04c0ff6
      MODE: ${{ inputs.mode }}
      PLAN_DIGEST: ${{ inputs.plan_digest }}
    steps:
      - name: Validate and execute bounded maintenance
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-before.json"
          mkdir -p "$RUNNER_TEMP/probe/deploy"
          cat > "$RUNNER_TEMP/probe/deploy/security.sh" <<'SECURITY_SCRIPT'
          #!/bin/bash
          set -Eeuo pipefail
          mode=${1:-diagnose}
          echo "MODE=$mode"
          if [[ "$mode" == finish ]]; then
            before=$(docker inspect --format '{{.Id}} {{.State.StartedAt}} {{.RestartCount}}' kitabcha-api-1 kitabcha-db-1 kitabcha-web-1)
            # The shutdown helper still held the old libapt after the APT security upgrade.
            sudo -n systemctl try-restart unattended-upgrades.service
            test "$before" = "$(docker inspect --format '{{.Id}} {{.State.StartedAt}} {{.RestartCount}}' kitabcha-api-1 kitabcha-db-1 kitabcha-web-1)"
            sudo -n needrestart -b -r l | grep -E '^NEEDRESTART-(KCUR|KEXP|SVC):' || true
            curl -fsS --max-time 20 https://app.kitabcha.app/health
            echo UPDATE_HELPER_REFRESHED_WITHOUT_APP_RESTARTS
          fi
          if [[ "$mode" == diagnose ]]; then
            sudo -n python3 - <<'PY'
          import pathlib,subprocess,re
          def show(args):
              r=subprocess.run(args,text=True,capture_output=True,timeout=90)
              print('$ '+' '.join(args));print(r.stdout[-18000:]);print('EXIT',r.returncode)
          show(['systemctl','show','apt-daily.service','apt-daily-upgrade.service','-p','Result','-p','ExecMainStartTimestamp','-p','ExecMainExitTimestamp','-p','ExecMainStatus','-p','ConditionResult'])
          show(['systemctl','cat','apt-daily.service','apt-daily-upgrade.service','apt-daily.timer','apt-daily-upgrade.timer'])
          show(['journalctl','-u','apt-daily.service','-u','apt-daily-upgrade.service','--since','2026-11-04','--no-pager','-n','70'])
          show(['apt-config','dump'])
          for name in ['update-stamp','download-upgradeable-stamp','upgrade-stamp','unattended-upgrades-stamp']:
              p=pathlib.Path('/var/lib/apt/periodic')/name
              print('STAMP',name,p.stat().st_mtime if p.exists() else None)
          p=pathlib.Path('/var/log/unattended-upgrades/unattended-upgrades.log')
          if p.exists():
              print('UNATTENDED_LOG');print('\n'.join(p.read_text(errors='replace').splitlines()[-100:]))
          p=pathlib.Path('/usr/lib/apt/apt.systemd.daily')
          text=p.read_text();print('DAILY_INTERVAL_CODE')
          lines=text.splitlines()
          for a,b in [(0,180),(350,550)]: print('\n'.join(f'{i+1}: {s}' for i,s in enumerate(lines) if a<=i<b))
          PY
          fi
          if [[ "$mode" == fix || "$mode" == verify ]]; then
            before=$(docker inspect --format '{{.Id}} {{.State.StartedAt}} {{.RestartCount}}' kitabcha-api-1 kitabcha-db-1 kitabcha-web-1)
            boot=$(cat /proc/sys/kernel/random/boot_id)
            sudo -n env REPAIR_MODE="$mode" bash <<'ROOT'
          set -Eeuo pipefail
          umask 077
          # Exercise Ubuntu's actual stamp function with an isolated same-day stamp.
          python3 - <<'PY'
          import pathlib,tempfile,subprocess
          text=pathlib.Path('/usr/lib/apt/apt.systemd.daily').read_text()
          function=text[text.index('check_stamp()'):text.index('\nupdate_stamp()')]
          with tempfile.NamedTemporaryFile() as stamp:
              script='debug_echo() { :; };\n'+function+'\ncheck_stamp "$1" "$2"'
              daily=subprocess.run(['/bin/sh','-c',script,'test',stamp.name,'1']).returncode
              always=subprocess.run(['/bin/sh','-c',script,'test',stamp.name,'always']).returncode
              assert daily==1 and always==0,(daily,always)
          print('SAME_DAY_STAMP_REGRESSION_PASSED: daily skips; always runs')
          PY
          if [[ "$REPAIR_MODE" == fix ]]; then
            backup=/opt/kitabcha/shared/automatic-update-repair-$(date -u +%Y%m%dT%H%M%SZ)
            mkdir -p "$backup"
            cp -p /etc/apt/apt.conf.d/99zz-kitabcha-security "$backup/99zz-kitabcha-security.before"
            python3 - <<'PY'
          import pathlib
          p=pathlib.Path('/etc/apt/apt.conf.d/99zz-kitabcha-security')
          s=p.read_text()
          for key in ['Update-Package-Lists','Unattended-Upgrade']:
              old=f'APT::Periodic::{key} "1";'
              new=f'APT::Periodic::{key} "always";'
              assert old in s or new in s,key
              s=s.replace(old,new)
          p.write_bytes(s.encode())
          PY
            # Run the real timer services, not just an unattended-upgrade dry run.
            started=$(date +%s)
            systemctl start apt-daily.service
            systemctl start apt-daily-upgrade.service
            test "$(stat -c %Y /var/lib/apt/periodic/update-stamp)" -ge "$started"
            test "$(stat -c %Y /var/lib/apt/periodic/upgrade-stamp)" -ge "$started"
            echo REAL_UPDATE_AND_INSTALL_SERVICES_COMPLETED
          fi
          python3 - <<'PY'
          import apt_pkg,pathlib,datetime,subprocess,json
          apt_pkg.init_config();apt_pkg.init_system()
          assert apt_pkg.config.find('APT::Periodic::Update-Package-Lists')=='always'
          assert apt_pkg.config.find('APT::Periodic::Unattended-Upgrade')=='always'
          assert apt_pkg.config.find_b('Unattended-Upgrade::Automatic-Reboot',False)
          assert apt_pkg.config.find('Unattended-Upgrade::Automatic-Reboot-Time')=='23:00'
          assert "'l'" in pathlib.Path('/etc/needrestart/conf.d/99-kitabcha-no-restarts.conf').read_text()
          for unit in ['apt-daily.service','apt-daily-upgrade.service']:
              result=subprocess.check_output(['systemctl','show',unit,'-p','Result','--value'],text=True).strip()
              assert result=='success',(unit,result)
          for name in ['update-stamp','upgrade-stamp']:
              p=pathlib.Path('/var/lib/apt/periodic')/name
              print(name,datetime.datetime.fromtimestamp(p.stat().st_mtime,datetime.timezone.utc).isoformat())
          print('PERIODIC_INTERVALS=always; SAFETY_SETTINGS_PRESERVED')
          PY
          test -z "$(dpkg --audit)"
          systemctl list-timers apt-daily.timer apt-daily-upgrade.timer --no-pager
          ROOT
            test "$before" = "$(docker inspect --format '{{.Id}} {{.State.StartedAt}} {{.RestartCount}}' kitabcha-api-1 kitabcha-db-1 kitabcha-web-1)"
            test "$boot" = "$(cat /proc/sys/kernel/random/boot_id)"
            docker exec kitabcha-db-1 pg_isready -U kitabcha -d kitabcha
            curl -fsS --max-time 20 https://app.kitabcha.app/health
            echo NO_APP_RESTARTS_OR_REBOOT
          fi
          SECURITY_SCRIPT
          printf '%s\n' '#!/bin/bash' 'set -Eeuo pipefail' 'bash "$(dirname "$0")/security.sh" finish' > "$RUNNER_TEMP/probe/deploy/release.sh"
          tar -czf "$RUNNER_TEMP/probe.tar.gz" -C "$RUNNER_TEMP/probe" .
          sum=$(sha256sum "$RUNNER_TEMP/probe.tar.gz" | cut -d' ' -f1)
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "v0.0.$GITHUB_RUN_ID $SOURCE_SHA $sum" < "$RUNNER_TEMP/probe.tar.gz" > "$RUNNER_TEMP/aggregate.json" 2> "$RUNNER_TEMP/probe-error.log"
          for i in {1..5}; do
            curl --fail -sS --max-time 20 -o /dev/null -w '%{http_code} %{time_connect} %{time_starttransfer} %{time_total}\n' https://app.kitabcha.app/health >> "$RUNNER_TEMP/runner-timings.txt"
          done
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-after.json"
          node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP;const a=JSON.parse(fs.readFileSync(p+"/marker-before.json")),b=JSON.parse(fs.readFileSync(p+"/marker-after.json"));if(a.commit!==b.commit||a.version!==b.version)process.exit(1);console.log("Maintenance completed; deployed application version unchanged.");'
      - name: Encrypt private diagnostic output
        if: always()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const files={};for(const name of ['aggregate.json','probe-error.log','ops-tests.log','runner-timings.txt','marker-before.json','marker-after.json']){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.existsSync(p))files[name]=fs.readFileSync(p,'utf8').slice(-2000000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(files)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'automatic-update-repair.enc'),JSON.stringify(sealed));console.log('Aggregate diagnostics encrypted for private analysis.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-update-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/automatic-update-repair.enc
          retention-days: 1
          if-no-files-found: error
