name: Publish verified Kitabcha Android website APK
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  android_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 4c6be18c12bb303ea6cfdf592e9ecc4396681895
      DEPLOY_VERSION: v3.7.193
    steps:
    - name: Require the successful verified Android workflow
      run: |-
        set -euo pipefail
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/40359934410" > "$RUNNER_TEMP/source-run.json"
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/40359934410/artifacts" > "$RUNNER_TEMP/source-artifacts.json"
        node --input-type=module <<'JS'
        import fs from 'node:fs';
        const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/source-run.json'));
        if(r.id!==40359934410||r.status!=='completed'||r.conclusion!=='success'||r.path!=='.github/workflows/android-play-bundle.yml')throw Error('The entire verified Android workflow must succeed');
        const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/source-artifacts.json')).artifacts.find(a=>a.id===12669196604&&a.name==='Kitabcha-2.0.108-android'&&!a.expired);
        if(!a||a.digest!=='sha256:ba11c09919e518584d4b807db8529403417b1f8e0efcaa0ed6c5e301a7e27c6e')throw Error('Unexpected verified APK artifact');
        console.log('Successful Android workflow and pinned artifact confirmed.');
        JS
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: 4c6be18c12bb303ea6cfdf592e9ecc4396681895
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
    - name: Require the matching successful web release
      run: |-
        set -euo pipefail
        curl --fail --silent --show-error https://app.kitabcha.app/web-release.json -o "$RUNNER_TEMP/required-web.json"
        node -e "const r=require(process.env.RUNNER_TEMP+'/required-web.json');if(r.commit!==process.env.SOURCE_SHA||r.version!=='v3.7.193')throw Error('Matching web release has not passed deployment gates');"
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/download-artifact@v4
      with:
        name: Kitabcha-2.0.108-android
        path: ${{ runner.temp }}/mobile
        run-id: 40359934410
        github-token: ${{ github.token }}
    - name: Install landing build dependencies
      run: npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/publish-install.log" 2>&1
    - name: Recheck existing APK signing, identity and alignment
      run: "set -euo pipefail\nsdk=\"$ANDROID_HOME/build-tools/36.0.0\"\nif [[ ! -x \"$sdk/apksigner\" ]]; then\n  manager=$(find\
        \ \"$ANDROID_HOME/cmdline-tools\" -path '*/bin/sdkmanager' -print -quit)\n  \"$manager\" 'build-tools;36.0.0' > \"\
        $RUNNER_TEMP/sdk-install.log\" 2>&1\nfi\npython3 scripts/verify-mobile-release.py \"$RUNNER_TEMP/mobile/Kitabcha-2.0.108-android.apk\"\
        \ 2.0.108 104 \"$RUNNER_TEMP/rechecked-release.json\" > \"$RUNNER_TEMP/apk-recheck.log\" 2>&1\ncmp \"$RUNNER_TEMP/mobile/release.json\"\
        \ \"$RUNNER_TEMP/rechecked-release.json\"\necho 'Existing signing identity, version, release features and 16 KB alignment\
        \ reverified.' "
    - name: Prepare verified Android publication
      run: |
        set -euo pipefail
        package="$RUNNER_TEMP/package"
        mkdir -p "$package/mobile" "$package/site/landing" "$package/deploy"
        apk="$RUNNER_TEMP/mobile/Kitabcha-2.0.108-android.apk"
        node --input-type=module <<'VERIFY'
        import fs from 'node:fs';import{createHash}from'node:crypto';
        const dir=process.env.RUNNER_TEMP+'/mobile';const r=JSON.parse(fs.readFileSync(dir+'/release.json'));const b=fs.readFileSync(dir+'/Kitabcha-2.0.108-android.apk');
        if(r.version!=='2.0.108'||r.versionCode!==104||r.bytes!==b.length||r.sha256!==createHash('sha256').update(b).digest('hex'))throw Error('APK verification manifest mismatch');
        VERIFY
        cp "$apk" "$package/mobile/"
        cp "$RUNNER_TEMP/mobile/release.json" "$package/mobile/"
        node --input-type=module <<'JS'
        import fs from 'node:fs';
        const p='apps/client/marketing/releases.json';const d=JSON.parse(fs.readFileSync(p));d.android=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/mobile/release.json'));fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
        JS
        node scripts/build-landing.mjs > "$RUNNER_TEMP/android-landing.log" 2>&1
        cp -r apps/client/public/landing/. "$package/site/landing/"
        cp "$RUNNER_TEMP/mobile/release.json" "$package/site/android-release.json"
        cp deploy/android-assets-release.sh "$package/deploy/release.sh"
        cp deploy/prune-android-downloads.py "$package/deploy/"
        tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/update.tar.gz" -C "$package" .
    - name: Publish through restricted receiver
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: |
        export GITHUB_SHA="$SOURCE_SHA"
        set -euo pipefail
        install -m 700 -d ~/.ssh
        trap 'rm -f ~/.ssh/id_ed25519' EXIT
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
        printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
        sum=$(sha256sum "$RUNNER_TEMP/update.tar.gz" | cut -d' ' -f1)
        for attempt in $(seq 1 20); do
          if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "$DEPLOY_VERSION $SOURCE_SHA $sum" < "$RUNNER_TEMP/update.tar.gz" > "$RUNNER_TEMP/receiver.log" 2>&1; then
            echo 'Receiver status captured privately.'
            exit 0
          fi
          echo 'Receiver status captured privately.'
          if ! grep -Eq 'Another CI deployment is running|Another deployment is running' "$RUNNER_TEMP/receiver.log"; then exit 1; fi
          sleep 30
        done
        exit 1
    - name: Verify published Android APK and latest-only download links
      run: |
        python3 - <<'PY'
        import hashlib,json,os,urllib.request
        expected=json.load(open(os.environ['RUNNER_TEMP']+'/mobile/release.json'))
        actual=json.load(urllib.request.urlopen('https://app.kitabcha.app/android-release.json',timeout=30));assert actual==expected
        with urllib.request.urlopen('https://app.kitabcha.app'+actual['url'],timeout=120) as response: data=response.read()
        assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']
        for route in ['', 'fa/', 'ps/']:
         assert actual['url'] in urllib.request.urlopen('https://kitabcha.app/'+route,timeout=30).read().decode()
        print('Signed Android release and all landing links verified.')
        PY
    concurrency:
      group: production-web-v3-release
      cancel-in-progress: false
