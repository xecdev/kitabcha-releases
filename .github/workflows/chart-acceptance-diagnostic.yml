name: Chart acceptance diagnostic
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        specs:
          - chart-probe
    env:
      CI: "1"
      SOURCE_SHA: 8f5ba79c8a6f62777e35f71b7d4308a927c862ea
      KITABCHA_BUILD_VERSION: v3.7.234
      EXPO_PUBLIC_API_URL: http://localhost:3001
      SPECS: ${{ matrix.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: 8f5ba79c8a6f62777e35f71b7d4308a927c862ea
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          fetch-depth: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install browser validation dependencies
        run: |-
          npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/browser-install.log" 2>&1
          npm run db:generate > "$RUNNER_TEMP/browser-prisma.log" 2>&1
      - name: Validate plans, owner dashboard, permissions and existing browser flows
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/validation-browser-install.log" 2>&1
          EXPO_PUBLIC_API_URL=http://localhost:3001 GITHUB_SHA="$SOURCE_SHA" npm run build:web > "$RUNNER_TEMP/validation-web.log" 2>&1
          node --input-type=module <<'CHARTPROBE'
          import fs from 'node:fs';
          fs.writeFileSync('tests/e2e/chart-probe.spec.ts',"import {test} from '@playwright/test';\nimport './financial-reports.spec';\ntest.afterEach(async({page},info)=>{\n if(info.status===info.expectedStatus)return;\n const data=await page.evaluate(()=>({url:location.pathname+location.search,viewport:{width:innerWidth,height:innerHeight},graphs:Array.from(document.querySelectorAll('.recharts-wrapper')).map(e=>{const b=e.getBoundingClientRect();return {bounds:{x:b.x,y:b.y,width:b.width,height:b.height},bars:Array.from(e.querySelectorAll('.recharts-bar-rectangle')).map(bar=>{const r=bar.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,path:bar.querySelector('path')?.getAttribute('d')?.slice(0,120)}}),cursor:e.querySelector('[data-testid=\"chart-bar-cursor\"]')?.outerHTML,tooltip:e.querySelector('.recharts-tooltip-wrapper')?.textContent}})})).catch(()=>({error:'page-unavailable'}));\n console.log('[DEBUG-chart-234] '+JSON.stringify({test:info.title,data}));\n const image=await page.screenshot().catch(()=>null);if(image)console.log('[DEBUG-chart-234-image] '+image.toString('base64'));\n});\n");
          CHARTPROBE

          for spec in $SPECS; do
            echo "Checking $spec in an isolated test server."
            if ! npx playwright test "tests/e2e/$spec.spec.ts" > "$RUNNER_TEMP/validation-browser.log" 2>&1; then
              echo "Browser gate failed: $spec; private details retained on runner."
              exit 1
            fi
          done
          echo 'Owner notifications, invoice links, team access and expiry browser checks passed.'
      - name: Encrypt private failure diagnostics
        if: failure()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |-
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const logs={};for(const name of fs.readdirSync(process.env.RUNNER_TEMP).filter(n=>n.endsWith('.log'))){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.statSync(p).isFile())logs[name]=fs.readFileSync(p,'utf8').slice(-1500000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(logs)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'web234-diagnostic.enc'),JSON.stringify(sealed));console.log('Private diagnostics encrypted for the local decryption key.');
          NODE
      - name: Upload encrypted diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web234-browser-${{ strategy.job-index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/web234-diagnostic.enc
          retention-days: 2
          if-no-files-found: ignore
