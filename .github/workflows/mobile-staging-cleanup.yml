name: Remove obsolete Android staging
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [check, fix]
      plan_digest:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: production-web-v3-release
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: d34747117f74c47c929ae7856066ef6e7976656f
      MODE: ${{ inputs.mode }}
      PLAN_DIGEST: ${{ inputs.plan_digest }}
    steps:
      - name: Validate and execute bounded maintenance
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-before.json"
          mkdir -p "$RUNNER_TEMP/probe/deploy"
          cat > "$RUNNER_TEMP/probe/deploy/security.sh" <<'SECURITY_SCRIPT'
          #!/bin/bash
          set -Eeuo pipefail
          sudo -n python3 - <<'PY'
          import pathlib,subprocess,json,shutil,hashlib,os
          root=pathlib.Path('/opt/kitabcha')
          targets=[root/'android-201',root/'android-202']
          def run(args): return subprocess.run(args,check=True,capture_output=True,text=True,timeout=60).stdout
          refs=[]
          for cid in run(['docker','ps','-aq']).split():
           mounts=json.loads(run(['docker','inspect','--format','{{json .Mounts}}',cid]))
           refs.extend(m['Source'] for m in mounts if m.get('Source'))
           for label in ['com.docker.compose.project.working_dir','com.docker.compose.project.config_files']:
            refs.extend(run(['docker','inspect','--format','{{index .Config.Labels "'+label+'"}}',cid]).strip().split(','))
          manifest=root/'shared/android-release.json'
          # Locate the published manifest without assuming a private configuration layout.
          import urllib.request
          with urllib.request.urlopen('https://app.kitabcha.app/android-release.json',timeout=20) as r: marker=json.load(r)
          relative=marker['url']
          if not relative.startswith('/downloads/android/') or '..' in pathlib.PurePosixPath(relative).parts: raise RuntimeError('Unexpected APK path')
          apk=root/'shared'/relative.lstrip('/')
          def sha(f):
           h=hashlib.sha256()
           with f.open('rb') as stream:
            for block in iter(lambda:stream.read(1048576),b''): h.update(block)
           return h.hexdigest()
          if apk.stat().st_size!=marker['bytes'] or sha(apk)!=marker['sha256']: raise RuntimeError('Published APK mismatch')
          identities={}
          for target in targets:
           if target.is_symlink() or target.resolve()!=target or target.parent.resolve()!=root.resolve() or not target.is_dir(): raise RuntimeError('Unsafe target')
           for ref in refs:
            if not ref.startswith('/'): continue
            r=pathlib.Path(ref).resolve()
            if r==target or target in r.parents: raise RuntimeError('Referenced staging directory')
           for current,dirs,files in os.walk(target,followlinks=False):
            for name in dirs+files:
             f=pathlib.Path(current,name)
             if f.is_symlink() or os.path.ismount(f): raise RuntimeError('Unexpected link or mount')
           st=target.stat();identities[str(target)]=(st.st_dev,st.st_ino)
          before=shutil.disk_usage('/')
          removed=[]
          for target in targets:
           st=target.stat()
           if (st.st_dev,st.st_ino)!=identities[str(target)]: raise RuntimeError('Target changed')
           shutil.rmtree(target)
           if target.exists(): raise RuntimeError('Removal incomplete')
           removed.append(str(target))
          if apk.stat().st_size!=marker['bytes'] or sha(apk)!=marker['sha256']: raise RuntimeError('Published APK changed')
          after=shutil.disk_usage('/')
          print(json.dumps({'kind':'mobile-staging-cleanup','removed':removed,'freeBytesBefore':before.free,'freeBytesAfter':after.free,'publishedApkVersion':marker['version'],'publishedApkHashVerified':True,'databaseBackupsAndVolumesUntouched':True}))
          PY
          curl -fsS --max-time 20 https://app.kitabcha.app/health
          SECURITY_SCRIPT
          printf '%s\n' '#!/bin/bash' 'set -Eeuo pipefail' 'bash "$(dirname "$0")/security.sh" fix' > "$RUNNER_TEMP/probe/deploy/release.sh"
          tar -czf "$RUNNER_TEMP/probe.tar.gz" -C "$RUNNER_TEMP/probe" .
          sum=$(sha256sum "$RUNNER_TEMP/probe.tar.gz" | cut -d' ' -f1)
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "v0.0.$GITHUB_RUN_ID $SOURCE_SHA $sum" < "$RUNNER_TEMP/probe.tar.gz" > "$RUNNER_TEMP/aggregate.json" 2> "$RUNNER_TEMP/probe-error.log"
          for i in {1..5}; do
            curl --fail -sS --max-time 20 -o /dev/null -w '%{http_code} %{time_connect} %{time_starttransfer} %{time_total}\n' https://app.kitabcha.app/health >> "$RUNNER_TEMP/runner-timings.txt"
          done
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-after.json"
          node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP;const a=JSON.parse(fs.readFileSync(p+"/marker-before.json")),b=JSON.parse(fs.readFileSync(p+"/marker-after.json"));if(a.commit!==b.commit||a.version!==b.version)process.exit(1);console.log("Maintenance completed; deployed application version unchanged.");'
      - name: Encrypt private diagnostic output
        if: always()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const files={};for(const name of ['aggregate.json','probe-error.log','ops-tests.log','runner-timings.txt','marker-before.json','marker-after.json']){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.existsSync(p))files[name]=fs.readFileSync(p,'utf8').slice(-2000000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(files)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'mobile-staging-cleanup.enc'),JSON.stringify(sealed));console.log('Aggregate diagnostics encrypted for private analysis.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-staging-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-staging-cleanup.enc
          retention-days: 1
          if-no-files-found: error
