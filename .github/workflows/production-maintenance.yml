name: Production storage maintenance and monitoring
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [inventory, cleanup, install, verify]
      plan_digest:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: production-web-v3-release
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: 9f346e2dd9f050ab7f328b64a8a145c0610614f1
      MODE: ${{ inputs.mode }}
      PLAN_DIGEST: ${{ inputs.plan_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: 9f346e2dd9f050ab7f328b64a8a145c0610614f1
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          path: source
      - name: Validate and execute bounded maintenance
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-before.json"
          mkdir -p "$RUNNER_TEMP/probe/deploy"
          (cd source && python3 tests/production-maintenance.test.py > "$RUNNER_TEMP/ops-tests.log" 2>&1)
          if test -f source/tests/request-history.test.py; then (cd source && python3 tests/request-history.test.py >> "$RUNNER_TEMP/ops-tests.log" 2>&1); fi
          case "$MODE" in inventory|cleanup|install|verify) ;; *) exit 1 ;; esac
          if [[ "$MODE" == cleanup ]]; then [[ "$PLAN_DIGEST" =~ ^[a-f0-9]{64}$ ]]; fi
          printf '%s' "$MODE" > "$RUNNER_TEMP/probe/deploy/mode"
          printf '%s' "$PLAN_DIGEST" > "$RUNNER_TEMP/probe/deploy/digest"
          for file in production-maintenance.py request_history.py; do
            if test -f "source/deploy/$file"; then cp "source/deploy/$file" "$RUNNER_TEMP/probe/deploy/$file"; fi
          done
          printf '%s\n' '#!/bin/bash' 'set -euo pipefail' 'python3 "$(dirname "$0")/production-maintenance.py" "$(cat "$(dirname "$0")/mode")" "$(cat "$(dirname "$0")/digest")"' > "$RUNNER_TEMP/probe/deploy/release.sh"
          tar -czf "$RUNNER_TEMP/probe.tar.gz" -C "$RUNNER_TEMP/probe" .
          sum=$(sha256sum "$RUNNER_TEMP/probe.tar.gz" | cut -d' ' -f1)
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "v0.0.$GITHUB_RUN_ID $SOURCE_SHA $sum" < "$RUNNER_TEMP/probe.tar.gz" > "$RUNNER_TEMP/aggregate.json" 2> "$RUNNER_TEMP/probe-error.log"
          for i in {1..5}; do
            curl --fail -sS --max-time 20 -o /dev/null -w '%{http_code} %{time_connect} %{time_starttransfer} %{time_total}\n' https://app.kitabcha.app/health >> "$RUNNER_TEMP/runner-timings.txt"
          done
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-after.json"
          node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP;const a=JSON.parse(fs.readFileSync(p+"/marker-before.json")),b=JSON.parse(fs.readFileSync(p+"/marker-after.json"));if(a.commit!==b.commit||a.version!==b.version)process.exit(1);JSON.parse(fs.readFileSync(p+"/aggregate.json"));console.log("Maintenance completed; deployed application version unchanged.");'
      - name: Encrypt private diagnostic output
        if: always()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const files={};for(const name of ['aggregate.json','probe-error.log','ops-tests.log','runner-timings.txt','marker-before.json','marker-after.json']){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.existsSync(p))files[name]=fs.readFileSync(p,'utf8').slice(-2000000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(files)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'production-maintenance.enc'),JSON.stringify(sealed));console.log('Aggregate diagnostics encrypted for private analysis.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-maintenance-${{ github.run_id }}
          path: ${{ runner.temp }}/production-maintenance.enc
          retention-days: 1
          if-no-files-found: error
