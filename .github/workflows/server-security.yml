name: Server security maintenance
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [inventory, patch, runtime, verify, reboot, final]
      plan_digest:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: production-web-v3-release
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: f3f8c0690650d4990a70398d6a005ffad3eb5a3f
      MODE: ${{ inputs.mode }}
      PLAN_DIGEST: ${{ inputs.plan_digest }}
    steps:
      - name: Validate and execute bounded maintenance
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-before.json"
          mkdir -p "$RUNNER_TEMP/probe/deploy"
          cat > "$RUNNER_TEMP/probe/deploy/security.sh" <<'SECURITY_SCRIPT'
          #!/bin/bash
          set -Eeuo pipefail
          umask 077
          mode=${1:-inventory}
          echo "MODE=$mode"
          id
          uname -r
          cat /etc/os-release
          df -h / /boot
          sudo -n true
          docker ps --format '{{.Names}} {{.Status}}'
          sudo -n systemctl --failed --no-pager
          sudo -n sh -c 'test ! -f /var/run/reboot-required || cat /var/run/reboot-required'
          if [[ "$mode" == inventory ]]; then
            sudo -n apt-get update -qq
            apt-cache policy linux-generic linux-image-generic openssh-server snapd
            sudo -n apt-get -s upgrade
            sudo -n find /opt/kitabcha/shared/backups -maxdepth 2 -type f -printf '%TY-%Tm-%TdT%TH:%TM %s %f\n' | tail -15
            docker inspect --format '{{.Name}} restart={{.HostConfig.RestartPolicy.Name}} image={{.Config.Image}}' $(docker ps -q)
            sudo -n ss -lnt
          fi
          if [[ "$mode" == patch ]]; then
            test "$(. /etc/os-release; echo "$VERSION_ID")" = 26.04
            test "$(df --output=avail -k / | tail -1)" -gt 8000000
            test -z "$(sudo -n dpkg --audit)"
            docker exec kitabcha-db-1 pg_isready -U kitabcha -d kitabcha
            backup="/opt/kitabcha/shared/backups/kitabcha-security-$(date -u +%Y%m%dT%H%M%SZ).dump"
            docker exec kitabcha-db-1 pg_dump -U kitabcha -d kitabcha -Fc | sudo -n tee "$backup" > /dev/null
            sudo -n chmod 600 "$backup"
            sudo -n sh -c 'docker exec -i kitabcha-db-1 pg_restore --list < "$1" > /dev/null' sh "$backup"
            sudo -n sha256sum "$backup"
            docker inspect --format '{{.Name}} {{range .Mounts}}{{.Type}}:{{.Name}}:{{.Destination}} {{end}}' kitabcha-db-1
            sudo -n apt-get update -qq
            packages=$(python3 - <<'PY'
          import apt
          c=apt.Cache()
          print(' '.join(sorted(p.name for p in c if p.is_installed and p.is_upgradable and any(o.archive == 'resolute-security' and o.origin == 'Ubuntu' for o in p.candidate.origins))))
          PY
            )
            echo "SECURITY_PACKAGES=$packages"
            sudo -n apt-get -s --no-remove install $packages linux-image-virtual
            sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -y --no-remove -o Dpkg::Options::=--force-confold install $packages linux-image-virtual
            test -z "$(sudo -n dpkg --audit)"
            dpkg-query -W linux-image-virtual linux-image-7.0.0-42-generic
            test -s /boot/vmlinuz-7.0.0-42-generic
            test -s /boot/initrd.img-7.0.0-42-generic
            docker exec kitabcha-db-1 pg_isready -U kitabcha -d kitabcha
            curl -fsS --max-time 20 https://app.kitabcha.app/health
            echo PATCH_COMPLETE
          fi
          if [[ "$mode" == runtime ]]; then
            test -z "$(sudo -n dpkg --audit)"
            runtime=$(apt-cache madison containerd.io | awk '$3 ~ /^2\.3\.7-/ && !found {print $3; found=1}')
            if [[ -z "$runtime" ]]; then
              runtime=$(apt-cache policy containerd.io | awk '/Candidate:/ {print $2}')
              [[ "$runtime" == 2.4.2-* ]]
            fi
            echo "CONTAINERD_TARGET=$runtime"
            packages=(docker-ce docker-ce-cli docker-ce-rootless-extras "containerd.io=$runtime" docker-buildx-plugin docker-compose-plugin)
            sudo -n apt-get -s --no-remove install "${packages[@]}"
            trap 'sudo -n systemctl start docker; docker start kitabcha-db-1 kitabcha-api-1 kitabcha-web-1 > /dev/null' EXIT
            docker stop --time 60 kitabcha-web-1 kitabcha-api-1 kitabcha-db-1
            sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -y --no-remove -o Dpkg::Options::=--force-confold install "${packages[@]}"
            sudo -n systemctl start docker
            docker start kitabcha-db-1
            for i in {1..40}; do if docker exec kitabcha-db-1 pg_isready -U kitabcha -d kitabcha > /dev/null 2>&1; then break; fi; sleep 2; done
            docker exec kitabcha-db-1 pg_isready -U kitabcha -d kitabcha
            docker start kitabcha-api-1 kitabcha-web-1
            for i in {1..40}; do if curl -fsS --max-time 5 https://app.kitabcha.app/health; then break; fi; sleep 3; done
            curl -fsS --max-time 20 https://app.kitabcha.app/health
            docker version --format '{{.Server.Version}}'
            containerd --version
            trap - EXIT
            echo RUNTIME_SECURITY_COMPLETE
          fi
          if [[ "$mode" == reboot ]]; then
            dpkg-query -W linux-image-7.0.0-42-generic
            test -s /boot/initrd.img-7.0.0-42-generic
            test -z "$(sudo -n dpkg --audit)"
            for container in kitabcha-db-1 kitabcha-api-1 kitabcha-web-1; do
              test "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$container")" = unless-stopped
            done
            sudo -n systemd-run --unit=kitabcha-security-reboot --on-active=45s /usr/bin/systemctl reboot
            echo REBOOT_SCHEDULED
          fi
          if [[ "$mode" == verify ]]; then
            test "$(uname -r)" = 7.0.0-42-generic
            dpkg-query -W linux-image-virtual linux-image-7.0.0-42-generic
            sudo -n dpkg --audit
            docker exec kitabcha-db-1 pg_isready -U kitabcha -d kitabcha
            docker inspect --format '{{.Name}} {{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}} {{range .Mounts}}{{.Type}}:{{.Name}}:{{.Destination}} {{end}}' kitabcha-db-1 kitabcha-api-1 kitabcha-web-1
            curl -fsS --max-time 20 https://app.kitabcha.app/health
            curl -fsS --max-time 20 https://app.kitabcha.app/web-release.json
            curl -fsS --max-time 20 -o /dev/null https://app.kitabcha.app/api/v1/auth/options
            backup=$(sudo -n find /opt/kitabcha/shared/backups -maxdepth 1 -type f -name 'kitabcha-security-*.dump' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
            test -n "$backup"
            restore="kitabcha-security-restore-$$"
            trap 'docker rm -f "$restore" > /dev/null 2>&1 || true' EXIT
            docker run -d --name "$restore" --network none --memory=2g --tmpfs /var/lib/postgresql/data:rw,size=1536m -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_USER=kitabcha -e POSTGRES_DB=kitabcha postgres:17-alpine > /dev/null
            for i in {1..30}; do
              if docker exec "$restore" pg_isready -U kitabcha -d kitabcha > /dev/null 2>&1; then break; fi
              sleep 2
            done
            sudo -n cat "$backup" | docker exec -i "$restore" pg_restore --exit-on-error --no-owner --no-privileges -U kitabcha -d kitabcha
            docker exec "$restore" psql -U kitabcha -d kitabcha -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'"
            docker rm -f "$restore" > /dev/null
            trap - EXIT
            echo BACKUP_RESTORE_VERIFIED
            echo SECURITY_REMAINING
            python3 - <<'PY'
          import apt
          c=apt.Cache()
          print(' '.join(sorted(p.name for p in c if p.is_installed and p.is_upgradable and any(o.archive == 'resolute-security' and o.origin == 'Ubuntu' for o in p.candidate.origins))))
          PY
          fi
          if [[ "$mode" == final ]]; then
            test "$(uname -r)" = 7.0.0-42-generic
            test "$(docker inspect --format '{{.State.Health.Status}}' kitabcha-api-1)" = healthy
            test "$(docker inspect --format '{{.State.Health.Status}}' kitabcha-db-1)" = healthy
            test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' kitabcha-db-1)" = kitabcha_postgres
            docker version --format '{{.Server.Version}}'
            containerd --version
            test ! -f /var/run/reboot-required
            test -z "$(sudo -n dpkg --audit)"
            curl -fsS --max-time 20 https://app.kitabcha.app/health
            echo FINAL_HEALTHY
          fi
          SECURITY_SCRIPT
          printf '%s\n' '#!/bin/bash' 'set -Eeuo pipefail' 'bash "$(dirname "$0")/security.sh" final' > "$RUNNER_TEMP/probe/deploy/release.sh"
          tar -czf "$RUNNER_TEMP/probe.tar.gz" -C "$RUNNER_TEMP/probe" .
          sum=$(sha256sum "$RUNNER_TEMP/probe.tar.gz" | cut -d' ' -f1)
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "v0.0.$GITHUB_RUN_ID $SOURCE_SHA $sum" < "$RUNNER_TEMP/probe.tar.gz" > "$RUNNER_TEMP/aggregate.json" 2> "$RUNNER_TEMP/probe-error.log"
          for i in {1..5}; do
            curl --fail -sS --max-time 20 -o /dev/null -w '%{http_code} %{time_connect} %{time_starttransfer} %{time_total}\n' https://app.kitabcha.app/health >> "$RUNNER_TEMP/runner-timings.txt"
          done
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-after.json"
          node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP;const a=JSON.parse(fs.readFileSync(p+"/marker-before.json")),b=JSON.parse(fs.readFileSync(p+"/marker-after.json"));if(a.commit!==b.commit||a.version!==b.version)process.exit(1);console.log("Maintenance completed; deployed application version unchanged.");'
      - name: Encrypt private diagnostic output
        if: always()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const files={};for(const name of ['aggregate.json','probe-error.log','ops-tests.log','runner-timings.txt','marker-before.json','marker-after.json']){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.existsSync(p))files[name]=fs.readFileSync(p,'utf8').slice(-2000000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(files)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'server-security.enc'),JSON.stringify(sealed));console.log('Aggregate diagnostics encrypted for private analysis.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-security-${{ github.run_id }}
          path: ${{ runner.temp }}/server-security.enc
          retention-days: 1
          if-no-files-found: error
