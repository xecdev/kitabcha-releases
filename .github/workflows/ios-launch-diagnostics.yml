name: Diagnose iOS launch harness
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable source
        required: true
permissions:
  contents: read
jobs:
  harness-diagnostic:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EAS_NO_TELEMETRY: "1"
      EAS_SKIP_AUTO_FINGERPRINT: "1"
      EXPO_PUBLIC_API_URL: https://app.kitabcha.app
      KITABCHA_BUILD_VERSION: 2.1.18
      SOURCE_SHA: ${{ inputs.source_ref }}
    steps:
      - name: Require immutable source
        shell: bash
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Require Xcode 27 and iOS 27 SDK
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          xcodebuild -version
          [[ "$(xcodebuild -version | head -n 1)" == 'Xcode 27.1' ]]
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$sdk_version" == 27.* ]]
          echo "Building with iOS SDK $sdk_version"
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install private dependencies
        shell: bash
        run: npm ci --include=dev --no-audit --no-fund >
          "$RUNNER_TEMP/private-ios-build.log" 2>&1
      - name: Validate native launch harness before compiling the app
        shell: bash
        run: python3 scripts/ios-launch-harness-selftest.py
          "$RUNNER_TEMP/ios-launch-selftest" >
          "$RUNNER_TEMP/private-ios-selftest.log" 2>&1
      - name: Encrypt simulator evidence
        if: always()
        env:
          DIAGNOSTIC_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtg3UeD8IE9A0fOZ1Oaal
            1pSoJkxstU4Nmi6qZ0qFRkgn5j9Hzm34TqjwEQVRCbujBSipjcdctR6rxToAbk8N
            WhaofmJnVgh8hCUytqi6JTNA2d11Ej/mIgPLwX0dgLdh4yPJsPotHSmolv+4rdcL
            PajxEksQbpaHPqwrkAk6UXhKCxn3dbVeOBNQ/CkIEA+uVF6RvQq8QQU+LN3tqPZg
            pGkJRY5M/ZnAnqe5FTd8M8SkWLbOd/dlu/ffWzZzsyr+bw6DR+PMSR6dE2thjLh+
            AHG0RBX+sSqTA1o6fSMRIn+/Pk3BwvTrPiDVKE5LzSRHzonkcGOXBOFVQkgaBT/w
            kwIDAQAB
            -----END PUBLIC KEY-----
        shell: bash
        run: |-
          node --input-type=module <<'JS'
          import fs from 'node:fs';import{randomBytes,createCipheriv,publicEncrypt,constants}from'node:crypto';
          const root=process.env.RUNNER_TEMP,files={};
          for(const p of [root+'/private-ios-build.log',root+'/private-ios-selftest.log',root+'/ios-launch-selftest/evidence/launch-xctest.log',...fs.existsSync(root+'/ios-launch-evidence')?fs.readdirSync(root+'/ios-launch-evidence').map(n=>root+'/ios-launch-evidence/'+n):[]])if(fs.existsSync(p)&&fs.statSync(p).isFile())files[p.split('/').at(-1)]=fs.readFileSync(p).toString('base64');
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(files)),cipher.final()]);
          const wrapped=publicEncrypt({key:process.env.DIAGNOSTIC_PUBLIC_KEY,oaepHash:'sha256',padding:constants.RSA_PKCS1_OAEP_PADDING},key);
          fs.writeFileSync(root+'/ios-launch.enc.json',JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-ios-launch-evidence
          path: ${{ runner.temp }}/ios-launch.enc.json
          retention-days: 2
      - name: Remove private simulator evidence
        if: always()
        shell: bash
        run: >-
          rm -rf "$RUNNER_TEMP/ios-launch-evidence"
          "$RUNNER_TEMP/ios-launch-selftest"

          rm -f "$RUNNER_TEMP/private-ios-build.log"
          "$RUNNER_TEMP/private-ios-selftest.log"
