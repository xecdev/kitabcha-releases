          cp .ci-validation/scripts/ci/generate-release.mjs scripts/ci/generate-release.mjs
          cp .ci-validation/tests/release-validation-source.test.mjs tests/release-validation-source.test.mjs
          cp .ci-validation/scripts/ci/select-ubuntu-mirror.py scripts/ci/select-ubuntu-mirror.py
          cp .ci-validation/tests/ubuntu-mirror.test.mjs tests/ubuntu-mirror.test.mjs
          git diff --exit-code -- apps packages package.json package-lock.json
      - &a3
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - *a1
      - *a2
      - &a5
        name: Select reachable signed Ubuntu archive
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/ci/select-ubuntu-mirror.py "$RUNNER_TEMP"
      - &a6
