name: Validate complete Kitabcha release
on:
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        specs:
          - report-consistency current-ui-fixes mobile-responsive pre-signin-language access-recovery bahij-web
          - pane-drafts offline-final-ux team-access website-pages mobile-keyboard switcher-animations grocery-audit profile-stock-premium
          - financial-reports quotation-header offline-phase3 record-payment-mode book-deletion reset-backup navigation-expiry refresh-interruption otp-email
          - report-filter-popup ledger offline-phase2 website-language ux-navigation-followups reset-cache-boundaries backup-restore support-layout web-startup readable-export
          - bill-actions mobile-workspace-20261115 header-trade-rtl app-language-ux cashbook background-saves qa-report-flows landing scale-reports
          - trade-editor-ui contact-input-ui people-entry-layout ui-feedback-regressions people-currency-selection screen-recovery book-switch-performance sale-visibility-units creator-ui
          - workspace-followups rtl-layout-parity calendar-controls scale-loading transaction-receipts books form-experience rejected-record-recovery setup-otp-enter qa-receipt-policy
          - notification-settings online-only barcode-scanner owner-support-view accounts-workspace marketing-v3 payment-pane ui-polish theme-speed
          - account-contact mobile-back offline-phase1 landing-masthead quotations more-hub push-notifications help-center form-enter
          - people-activity report-reminder-follow-up hardware-barcode-scanner transaction-balance-motion transaction-drafts forms-refresh list-hover app-recovery report-attachments billing-emails
          - notification-inbox records-toolbars otp-ui input-direction team-viewer interaction-motion onboarding-prefill bill-confirmation landing-faq otp-auto
          - auth business-assets multi-currency-bills customer-proof-motion team-identity recovery-reload slow-network-stock plan-tiers loading-version scale-validation
    env:
      CI: "1"
      SOURCE_SHA: 880d1bfac8ff03bd780ddbfeb0cd7a7c235643bd
      KITABCHA_BUILD_VERSION: v3.8.38
      EXPO_PUBLIC_API_URL: http://localhost:3001
      SPECS: ${{ matrix.specs }}
      EXPO_PUBLIC_ENTITLEMENT_KEY: 087b7041c48b7f58b4357d170ddb97cc3ad66974fa992e5ca9ad2b0ac9fa0bba
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: 880d1bfac8ff03bd780ddbfeb0cd7a7c235643bd
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          fetch-depth: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - &a1
        uses: actions/cache@v4
        with:
          path: ~/.npm/_cacache
          key: npm-public-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - &a2
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Select reachable signed Ubuntu archive
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/ci/select-ubuntu-mirror.py "$RUNNER_TEMP"
      - name: Install invoice image renderer
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils > "$RUNNER_TEMP/invoice-renderer-install.log" 2>&1
      - name: Install browser validation dependencies
        run: |-
          npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/browser-install.log" 2>&1
          npm run db:generate > "$RUNNER_TEMP/browser-prisma.log" 2>&1
      - name: Install pinned Caddy for receipt policy regression
        if: contains(matrix.specs, 'qa-receipt-policy')
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 --silent --show-error --header "Accept: application/octet-stream" "https://api.github.com/repos/caddyserver/caddy/releases/assets/711594947?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT" -o caddy_2.11.9_linux_amd64.tar.gz || \
          curl --fail --location --retry 3 --silent --show-error https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_amd64.tar.gz -o caddy_2.11.9_linux_amd64.tar.gz

          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 --silent --show-error --header "Accept: application/octet-stream" "https://api.github.com/repos/caddyserver/caddy/releases/assets/711595488?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT" -o caddy_checksums.txt || \
          curl --fail --location --retry 3 --silent --show-error https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_checksums.txt -o caddy_checksums.txt

          echo '5b8cb7faf8726a2028ad96a66e54e6e81e8f361bc6175e5d22bbd997cc5177fb  caddy_2.11.9_linux_amd64.tar.gz' | sha256sum --check --status
          grep ' caddy_2.11.9_linux_amd64.tar.gz$' caddy_checksums.txt | sha512sum --check --status
          tar -xzf caddy_2.11.9_linux_amd64.tar.gz caddy
          chmod 700 caddy
          echo "CADDY_EXECUTABLE=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"
      - name: Validate plans, owner dashboard, permissions and existing browser flows
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/validation-browser-install.log" 2>&1
          EXPO_PUBLIC_API_URL=http://localhost:3001 GITHUB_SHA="$SOURCE_SHA" npm run build:web > "$RUNNER_TEMP/validation-web.log" 2>&1
          failed=0
          for spec in $SPECS; do
            echo "Checking $spec in an isolated test server."
            if ! npx playwright test "tests/e2e/$spec.spec.ts" > "$RUNNER_TEMP/browser-$spec.log" 2>&1; then
              echo "Browser gate failed: $spec; private details retained on runner."
              failed=1
              find test-results -name error-context.md -type f -exec cat {} + > "$RUNNER_TEMP/browser-context-$spec.log"
            fi
          done
          test "$failed" = 0
          echo 'Owner notifications, invoice links, team access and expiry browser checks passed.'
      - name: Capture private browser failure context
        if: failure()
        run: find test-results -name error-context.md -type f -exec cat {} + > "$RUNNER_TEMP/browser-context.log"
      - name: Encrypt private failure diagnostics
        if: failure()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |-
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const logs={};for(const name of fs.readdirSync(process.env.RUNNER_TEMP).filter(n=>n.endsWith('.log'))){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.statSync(p).isFile())logs[name]=fs.readFileSync(p,'utf8').slice(-1500000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(logs)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'release-${{ github.job }}-diagnostic.enc'),JSON.stringify(sealed));console.log('Private diagnostics encrypted for the local decryption key.');
          NODE
      - name: Upload encrypted diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.job }}-browser-${{ strategy.job-index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-${{ github.job }}-diagnostic.enc
          retention-days: 2
          if-no-files-found: ignore
  unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CI: "1"
      SOURCE_SHA: 880d1bfac8ff03bd780ddbfeb0cd7a7c235643bd
      KITABCHA_BUILD_VERSION: v3.8.38
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: 880d1bfac8ff03bd780ddbfeb0cd7a7c235643bd
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          fetch-depth: 9
      - &a3
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - *a1
      - *a2
      - &a5
        name: Select reachable signed Ubuntu archive
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/ci/select-ubuntu-mirror.py "$RUNNER_TEMP"
      - &a6
        name: Install invoice image renderer
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils > "$RUNNER_TEMP/invoice-renderer-install.log" 2>&1
      - &a4
        name: Install locked validation dependencies
        run: |-
          set -euo pipefail
          npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
          npm run db:generate > "$RUNNER_TEMP/prisma.log" 2>&1
      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium > "$RUNNER_TEMP/playwright.log" 2>&1
      - name: Validate complete TypeScript shard
        run: |-
          set -euo pipefail
          node --import tsx --test --test-reporter=tap --test-concurrency=2 --test-timeout=120000 --test-shard="$SHARD/3" tests/*.test.ts > "$RUNNER_TEMP/unit.log" 2>&1
          grep -E "^# (tests|pass|fail|skipped)" "$RUNNER_TEMP/unit.log"
      - name: Encrypt private failure diagnostics
        if: failure()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |-
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const logs={};for(const name of fs.readdirSync(process.env.RUNNER_TEMP).filter(n=>n.endsWith('.log'))){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.statSync(p).isFile())logs[name]=fs.readFileSync(p,'utf8').slice(-1500000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(logs)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'release-${{ github.job }}-diagnostic.enc'),JSON.stringify(sealed));console.log('Private diagnostics encrypted for the local decryption key.');
          NODE
      - name: Upload encrypted diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.job }}-unit-${{ strategy.job-index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-${{ github.job }}-diagnostic.enc
          retention-days: 2
          if-no-files-found: ignore
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
  quality:
