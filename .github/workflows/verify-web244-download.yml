name: Verify published Kitabcha v244 download
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-download:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Verify public live marker and unchanged Android APK
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 --silent --show-error https://kitabcha.app/downloads/android/a3ce4ab275b1/Kitabcha-2.0.124-android.apk -o "$RUNNER_TEMP/kitabcha.apk"
          echo 'a3ce4ab275b1e9c43f5350adcb67b47171694d7690ad9a7f989c53ed825095b1  '"$RUNNER_TEMP/kitabcha.apk" | sha256sum --check
          test "$(stat -c %s "$RUNNER_TEMP/kitabcha.apk")" = '99556787'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const marker=await(await fetch('https://app.kitabcha.app/web-release.json')).json();assert.equal(marker.version,'v3.7.244');assert.equal(marker.commit,'fa222064e07065a28106e3578ac1c4c525a58f75');
          const health=await(await fetch('https://app.kitabcha.app/health')).json();assert.equal(health.status,'ok');
          const android=await(await fetch('https://app.kitabcha.app/android-release.json')).json();assert.equal(android.version,'2.0.124');assert.equal(android.url,'/downloads/android/a3ce4ab275b1/Kitabcha-2.0.124-android.apk');
          console.log(JSON.stringify({marker,health:health.status,apkVersion:android.version,bytes:99556787,sha256:'a3ce4ab275b1e9c43f5350adcb67b47171694d7690ad9a7f989c53ed825095b1'}));
          NODE
