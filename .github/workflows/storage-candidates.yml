name: Storage cleanup candidate inventory
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [check, fix]
      plan_digest:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: production-web-v3-release
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: d34747117f74c47c929ae7856066ef6e7976656f
      MODE: ${{ inputs.mode }}
      PLAN_DIGEST: ${{ inputs.plan_digest }}
    steps:
      - name: Validate and execute bounded maintenance
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-before.json"
          mkdir -p "$RUNNER_TEMP/probe/deploy"
          cat > "$RUNNER_TEMP/probe/deploy/security.sh" <<'SECURITY_SCRIPT'
          #!/bin/bash
          set -Eeuo pipefail
          sudo -n python3 - <<'PY'
          import subprocess,pathlib,json,shutil,os,time
          
          def run(args,timeout=60):
           try:
            r=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
            return {'ok':r.returncode==0,'output':r.stdout.strip()}
           except subprocess.TimeoutExpired: return {'ok':False,'timeout':True}
          def size(p):
           r=run(['du','-sx','-B1',str(p)])
           return int(r['output'].split()[0]) if r.get('ok') and r.get('output') else r
          refs=[]
          ids=run(['docker','ps','-aq'])
          if ids.get('ok'):
           for cid in ids['output'].split():
            mounts=run(['docker','inspect','--format','{{json .Mounts}}',cid])
            if mounts.get('ok'): refs.extend(m.get('Source','') for m in json.loads(mounts['output']))
            for key in ['com.docker.compose.project.working_dir','com.docker.compose.project.config_files']:
             r=run(['docker','inspect','--format','{{index .Config.Labels "'+key+'"}}',cid])
             if r.get('ok'): refs.extend(r['output'].split(','))
          folders=[]
          for parent in ['/opt/kitabcha','/var/cache','/var/log','/root/.cache']:
           base=pathlib.Path(parent)
           if not base.is_dir(): continue
           for f in base.iterdir():
            if f.is_dir() and not f.is_symlink():
             folders.append({'path':str(f),'bytes':size(f),'referencedByContainer':any(r.startswith('/') and (pathlib.Path(r).resolve()==f.resolve() or f.resolve() in pathlib.Path(r).resolve().parents) for r in refs),'ageDays':round((time.time()-f.stat().st_mtime)/86400,1)})
          volumes=[]
          v=run(['docker','volume','ls','-q'])
          if v.get('ok'):
           for name in v['output'].split():
            mp=run(['docker','volume','inspect','--format','{{.Mountpoint}}',name])
            users=run(['docker','ps','-aq','--filter','volume='+name])
            volumes.append({'name':name,'bytes':size(mp['output']) if mp.get('ok') else None,'referencedByContainer':bool(users.get('output')),'referenceCheckSucceeded':users.get('ok')})
          disk=shutil.disk_usage('/')
          print(json.dumps({'kind':'storage-candidates','folders':folders,'volumes':volumes,'dockerUsage':run(['docker','system','df','--format','{{json .}}'],120),'journalUsage':run(['journalctl','--disk-usage']),'freeBytes':disk.free,'readOnly':True}))
          PY
          curl -fsS --max-time 20 https://app.kitabcha.app/health
          SECURITY_SCRIPT
          printf '%s\n' '#!/bin/bash' 'set -Eeuo pipefail' 'bash "$(dirname "$0")/security.sh" check' > "$RUNNER_TEMP/probe/deploy/release.sh"
          tar -czf "$RUNNER_TEMP/probe.tar.gz" -C "$RUNNER_TEMP/probe" .
          sum=$(sha256sum "$RUNNER_TEMP/probe.tar.gz" | cut -d' ' -f1)
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "v0.0.$GITHUB_RUN_ID $SOURCE_SHA $sum" < "$RUNNER_TEMP/probe.tar.gz" > "$RUNNER_TEMP/aggregate.json" 2> "$RUNNER_TEMP/probe-error.log"
          for i in {1..5}; do
            curl --fail -sS --max-time 20 -o /dev/null -w '%{http_code} %{time_connect} %{time_starttransfer} %{time_total}\n' https://app.kitabcha.app/health >> "$RUNNER_TEMP/runner-timings.txt"
          done
          curl --fail -sS --max-time 20 https://app.kitabcha.app/web-release.json > "$RUNNER_TEMP/marker-after.json"
          node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP;const a=JSON.parse(fs.readFileSync(p+"/marker-before.json")),b=JSON.parse(fs.readFileSync(p+"/marker-after.json"));if(a.commit!==b.commit||a.version!==b.version)process.exit(1);console.log("Maintenance completed; deployed application version unchanged.");'
      - name: Encrypt private diagnostic output
        if: always()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const files={};for(const name of ['aggregate.json','probe-error.log','ops-tests.log','runner-timings.txt','marker-before.json','marker-after.json']){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.existsSync(p))files[name]=fs.readFileSync(p,'utf8').slice(-2000000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(files)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'storage-candidates.enc'),JSON.stringify(sealed));console.log('Aggregate diagnostics encrypted for private analysis.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-candidates-${{ github.run_id }}
          path: ${{ runner.temp }}/storage-candidates.enc
          retention-days: 1
          if-no-files-found: error
