name: Diagnose isolated validation runtime
on:
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: 6b09420a0866f7109e322e3941dee33f6ea0735f
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          fetch-depth: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/cache@v4
        with:
          path: ~/.npm/_cacache
          key: npm-public-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Reproduce native runtime crash with unchanged assertions
        run: |-
          set -euo pipefail
          npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
          npm run db:generate > "$RUNNER_TEMP/prisma.log" 2>&1
          for attempt in 1 2 3; do
            echo "Checking authentication runtime repetition $attempt"
            node --import tsx --test --test-timeout=120000 tests/auth-session-races.test.ts > "$RUNNER_TEMP/auth-$attempt.log" 2>&1
          done
          echo "All three authentication runtime repetitions passed."
      - name: Encrypt private failure diagnostics
        if: failure()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |-
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const logs={};for(const name of fs.readdirSync(process.env.RUNNER_TEMP).filter(n=>n.endsWith('.log'))){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.statSync(p).isFile())logs[name]=fs.readFileSync(p,'utf8').slice(-1500000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(logs)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'web3811-diagnostic.enc'),JSON.stringify(sealed));console.log('Private diagnostics encrypted for the local decryption key.');
          NODE
      - name: Upload encrypted diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/web3811-diagnostic.enc
          retention-days: 2
          if-no-files-found: ignore
