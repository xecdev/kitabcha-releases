name: Publish verified release with web image layer maintenance
permissions:
  contents: read
  actions: read
concurrency:
  group: production-web-v3-release
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      SOURCE_SHA: e6d70863c31516f55d1583a732dba76c6d010bc6
      DEPLOY_VERSION: v3.7.125
      KITABCHA_BUILD_VERSION: v3.7.125
      EXPO_PUBLIC_API_URL: https://app.kitabcha.app
    steps:
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: e6d70863c31516f55d1583a732dba76c6d010bc6
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
        fetch-depth: 9
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: 3629d99feeb5f0cfc31707a96e9650029c93e15a
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
        path: deployment-patch
        sparse-checkout: deploy
        sparse-checkout-cone-mode: true
    - name: Apply and validate deployment-only image maintenance
      run: 'cp deployment-patch/deploy/commercial-release.sh deploy/commercial-release.sh

        bash -n deploy/commercial-release.sh'
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Build tested web and API package
      run: 'set -euo pipefail

        npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1

        npm run db:generate > "$RUNNER_TEMP/prisma.log" 2>&1

        GITHUB_SHA="$SOURCE_SHA" npm run build:web > "$RUNNER_TEMP/web-build.log" 2>&1

        update="$RUNNER_TEMP/package"

        mkdir -p "$update/site" "$update/deploy" "$update/apps/api/src" "$update/apps/api/assets" "$update/apps/api/prisma" "$update/packages/domain/src"
        "$update/node_modules"

        cp -r apps/client/dist/. "$update/site/"

        rm -rf "$update/site/landing" "$update/site/downloads"

        rm -f "$update/site/website-sw.js" "$update/site/android-release.json"

        cp -r apps/api/src/. "$update/apps/api/src/"

        cp apps/api/assets/* "$update/apps/api/assets/"

        cp -r packages/domain/src/. "$update/packages/domain/src/"

        cp packages/domain/package.json "$update/packages/domain/"

        node scripts/copy-runtime-deps.mjs "$update" sharp qrcode firebase-admin web-push fflate @fastify/jwt > "$RUNNER_TEMP/runtime.log" 2>&1

        cp apps/api/package.json "$update/apps/api/"

        cp package-lock.json "$update/"

        cp -r apps/api/prisma/. "$update/apps/api/prisma/"

        cp deploy/commercial-release.sh "$update/deploy/release.sh"

        cp deploy/patch-public-pages.sh "$update/deploy/"

        mkdir -p "$update/site/landing"

        cp -r apps/client/public/landing/. "$update/site/landing/"

        tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/update.tar.gz" -C "$update" .

        echo ''Production package prepared without publishing private source.''

        '
    - name: Publish through restricted receiver
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: "export GITHUB_SHA=\"$SOURCE_SHA\"\nset -euo pipefail\ninstall -m 700 -d ~/.ssh\ntrap 'rm -f ~/.ssh/id_ed25519' EXIT\nprintf '%s\\n' \"$VPS_SSH_KEY\"\
        \ > ~/.ssh/id_ed25519\nprintf '%s\\n' \"$VPS_KNOWN_HOSTS\" > ~/.ssh/known_hosts\nchmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts\nsum=$(sha256sum\
        \ \"$RUNNER_TEMP/update.tar.gz\" | cut -d' ' -f1)\nfor attempt in $(seq 1 20); do\n  if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o\
        \ ConnectTimeout=20 -o ServerAliveInterval=15 deploy@\"$VPS_HOST\" \"$DEPLOY_VERSION $SOURCE_SHA $sum\" < \"$RUNNER_TEMP/update.tar.gz\" > \"$RUNNER_TEMP/receiver.log\"\
        \ 2>&1; then\n    cat \"$RUNNER_TEMP/receiver.log\"\n    exit 0\n  fi\n  cat \"$RUNNER_TEMP/receiver.log\"\n  if ! grep -Eq 'Another CI deployment\
        \ is running|Another deployment is running' \"$RUNNER_TEMP/receiver.log\"; then exit 1; fi\n  sleep 30\ndone\nexit 1\n"
    - name: Verify web publication
      run: 'curl --fail --retry 5 https://app.kitabcha.app/web-release.json -o "$RUNNER_TEMP/web-release.json"

        node -e "const r=require(process.env.RUNNER_TEMP+''/web-release.json'');if(r.commit!==process.env.SOURCE_SHA||r.version!==process.env.DEPLOY_VERSION)process.exit(1);console.log(r)"

        curl --fail --retry 5 https://app.kitabcha.app/health

        '
    needs:
    - verified_build
  android_publish:
    runs-on: ubuntu-latest
    needs:
    - web
    - verified_build
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: e6d70863c31516f55d1583a732dba76c6d010bc6
      DEPLOY_VERSION: v3.7.126
    steps:
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: e6d70863c31516f55d1583a732dba76c6d010bc6
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: 3629d99feeb5f0cfc31707a96e9650029c93e15a
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
        path: deployment-patch
        sparse-checkout: deploy
        sparse-checkout-cone-mode: true
    - name: Apply and validate deployment-only image maintenance
      run: 'cp deployment-patch/deploy/android-assets-release.sh deploy/android-assets-release.sh

        bash -n deploy/android-assets-release.sh'
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/download-artifact@v4
      with:
        name: Kitabcha-2.0.83-android
        path: ${{ runner.temp }}/mobile
        run-id: 39201868018
        github-token: ${{ github.token }}
    - name: Install landing build dependencies
      run: npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/publish-install.log" 2>&1
    - name: Prepare verified Android publication
      run: 'set -euo pipefail

        package="$RUNNER_TEMP/package"

        mkdir -p "$package/mobile" "$package/site/landing" "$package/deploy"

        apk="$RUNNER_TEMP/mobile/Kitabcha-2.0.83-android.apk"

        python3 scripts/verify-mobile-release.py "$apk" 2.0.83 80 "$RUNNER_TEMP/mobile/release.json"

        cp "$apk" "$package/mobile/"

        cp "$RUNNER_TEMP/mobile/release.json" "$package/mobile/"

        node --input-type=module <<''JS''

        import fs from ''node:fs'';

        const p=''apps/client/marketing/releases.json'';const d=JSON.parse(fs.readFileSync(p));d.android=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+''/mobile/release.json''));fs.writeFileSync(p,JSON.stringify(d,null,2)+''\n'');

        JS

        node scripts/build-landing.mjs > "$RUNNER_TEMP/android-landing.log" 2>&1

        cp -r apps/client/public/landing/. "$package/site/landing/"

        cp "$RUNNER_TEMP/mobile/release.json" "$package/site/android-release.json"

        cp deploy/android-assets-release.sh "$package/deploy/release.sh"

        cp deploy/prune-android-downloads.py "$package/deploy/"

        tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/update.tar.gz" -C "$package" .

        '
    - name: Publish through restricted receiver
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: "export GITHUB_SHA=\"$SOURCE_SHA\"\nset -euo pipefail\ninstall -m 700 -d ~/.ssh\ntrap 'rm -f ~/.ssh/id_ed25519' EXIT\nprintf '%s\\n' \"$VPS_SSH_KEY\"\
        \ > ~/.ssh/id_ed25519\nprintf '%s\\n' \"$VPS_KNOWN_HOSTS\" > ~/.ssh/known_hosts\nchmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts\nsum=$(sha256sum\
        \ \"$RUNNER_TEMP/update.tar.gz\" | cut -d' ' -f1)\nfor attempt in $(seq 1 20); do\n  if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o\
        \ ConnectTimeout=20 -o ServerAliveInterval=15 deploy@\"$VPS_HOST\" \"$DEPLOY_VERSION $SOURCE_SHA $sum\" < \"$RUNNER_TEMP/update.tar.gz\" > \"$RUNNER_TEMP/receiver.log\"\
        \ 2>&1; then\n    cat \"$RUNNER_TEMP/receiver.log\"\n    exit 0\n  fi\n  cat \"$RUNNER_TEMP/receiver.log\"\n  if ! grep -Eq 'Another CI deployment\
        \ is running|Another deployment is running' \"$RUNNER_TEMP/receiver.log\"; then exit 1; fi\n  sleep 30\ndone\nexit 1\n"
    - name: Verify published Android APK and latest-only download links
      run: "python3 - <<'PY'\nimport hashlib,json,os,urllib.request\nexpected=json.load(open(os.environ['RUNNER_TEMP']+'/mobile/release.json'))\nactual=json.load(urllib.request.urlopen('https://app.kitabcha.app/android-release.json',timeout=30));assert\
        \ actual==expected\nwith urllib.request.urlopen('https://app.kitabcha.app'+actual['url'],timeout=120) as response: data=response.read()\nassert\
        \ len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']\nfor route in ['', 'fa/', 'ps/']:\n assert actual['url']\
        \ in urllib.request.urlopen('https://kitabcha.app/'+route,timeout=30).read().decode()\nprint('Signed Android release and all landing links verified.')\n\
        PY\n"
  verified_build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: 7547bfe43eb458d5c41d850b16d5718257f89213
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
        fetch-depth: 2
    - name: Verify production source unchanged by test harness repair
      run: 'test "$(git rev-parse HEAD^)" = "e6d70863c31516f55d1583a732dba76c6d010bc6"

        test "$(git diff --name-only HEAD^ HEAD)" = "tests/onboarding-hydration.test.mjs"'
    - uses: actions/github-script@v7
      with:
        script: 'const {data} = await github.rest.actions.listJobsForWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:39201868018,per_page:100});

          const browsers=data.jobs.filter(j=>j.name.startsWith(''browser (''));

          if(browsers.length!==4 || browsers.some(j=>j.conclusion!==''success'')) throw Error(''Browser gates incomplete'');

          for(const name of [''android'',''recovery'']) if(!data.jobs.some(j=>j.name===name && j.conclusion===''success'')) throw Error(name+'' gate incomplete'');

          core.info(''All browser groups, recovery and signed Android build verified for the unchanged production source.'');

          const unitRun=await github.rest.actions.listJobsForWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:39203100991,per_page:100});

          if(!unitRun.data.jobs.some(j=>j.name===''unit'' && j.conclusion===''success'')) throw Error(''Full unit gate incomplete'');

          core.info(''Full API, adapter, type and lint gate verified.'');'
'on':
  workflow_dispatch: null
