name: Release current Kitabcha web and API
permissions:
  contents: read
  actions: read
concurrency:
  group: production-web-v3-release
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CI: "1"
      SOURCE_SHA: f73a09a2e2c9bb2e3911c816dee320e78cef132e
      DEPLOY_VERSION: v3.7.203
      KITABCHA_BUILD_VERSION: v3.7.203
      EXPO_PUBLIC_API_URL: https://app.kitabcha.app
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: f73a09a2e2c9bb2e3911c816dee320e78cef132e
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          fetch-depth: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Build tested web and API package
        run: >
          set -euo pipefail

          npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/install.log"
          2>&1

          npm run db:generate > "$RUNNER_TEMP/prisma.log" 2>&1

          GITHUB_SHA="$SOURCE_SHA" npm run build:web >
          "$RUNNER_TEMP/web-build.log" 2>&1

          update="$RUNNER_TEMP/package"

          mkdir -p "$update/site" "$update/deploy" "$update/apps/api/src"
          "$update/apps/api/assets" "$update/apps/api/prisma"
          "$update/packages/domain/src" "$update/node_modules"

          cp -r apps/client/dist/. "$update/site/"

          rm -rf "$update/site/landing" "$update/site/downloads"

          rm -f "$update/site/website-sw.js" "$update/site/android-release.json"

          cp -r apps/api/src/. "$update/apps/api/src/"

          cp apps/api/assets/* "$update/apps/api/assets/"

          cp -r packages/domain/src/. "$update/packages/domain/src/"

          cp packages/domain/package.json "$update/packages/domain/"

          node scripts/copy-runtime-deps.mjs "$update" sharp qrcode
          firebase-admin web-push fflate @fastify/jwt >
          "$RUNNER_TEMP/runtime.log" 2>&1

          cp apps/api/package.json "$update/apps/api/"

          cp package-lock.json "$update/"

          cp -r apps/api/prisma/. "$update/apps/api/prisma/"

          cp deploy/commercial-release.sh "$update/deploy/release.sh"

          cp deploy/patch-public-pages.sh "$update/deploy/"

          mkdir -p "$update/site/landing"

          cp -r apps/client/public/landing/. "$update/site/landing/"

          tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf
          "$RUNNER_TEMP/update.tar.gz" -C "$update" .

          echo 'Production package prepared without publishing private source.'
      - name: Publish through restricted receiver
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: >
          export GITHUB_SHA="$SOURCE_SHA"

          set -euo pipefail

          install -m 700 -d ~/.ssh

          trap 'rm -f ~/.ssh/id_ed25519' EXIT

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          sum=$(sha256sum "$RUNNER_TEMP/update.tar.gz" | cut -d' ' -f1)

          for attempt in $(seq 1 20); do
            if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "$DEPLOY_VERSION $SOURCE_SHA $sum" < "$RUNNER_TEMP/update.tar.gz" > "$RUNNER_TEMP/receiver.log" 2>&1; then
              echo 'Receiver status captured privately.'
              exit 0
            fi
            echo 'Receiver status captured privately.'
            if ! grep -Eq 'Another CI deployment is running|Another deployment is running' "$RUNNER_TEMP/receiver.log"; then exit 1; fi
            sleep 30
          done

          exit 1
      - name: Verify web publication
        run: |
          curl --fail --retry 5 https://app.kitabcha.app/web-release.json -o "$RUNNER_TEMP/web-release.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/web-release.json');if(r.commit!==process.env.SOURCE_SHA||r.version!==process.env.DEPLOY_VERSION)process.exit(1);console.log(r)"
          curl --fail --retry 5 https://app.kitabcha.app/health
    needs:
      - browser
      - unit
      - recovery
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        specs:
          - slow-network-stock barcode-scanner quotations online-only
            team-identity notification-settings trade-editor-ui
            record-payment-mode theme-speed bahij-web transaction-receipts
            team-access screen-recovery refresh-interruption auth landing
            mobile-keyboard background-saves mobile-responsive
          - readable-export backup-restore contact-input-ui push-notifications creator-ui
            payment-pane website-language reset-backup more-hub bill-actions
            profile-stock-premium pane-drafts forms-refresh pre-signin-language
          - sale-visibility-units access-recovery navigation-expiry plan-tiers
            marketing-v3 app-language-ux reset-cache-boundaries book-deletion
            accounts-workspace
          - people-entry-layout rejected-record-recovery help-center team-viewer onboarding-prefill notification-inbox bill-confirmation cashbook
            website-pages switcher-animations transaction-drafts
            financial-reports people-currency-selection report-attachments
    env:
      CI: "1"
      SOURCE_SHA: f73a09a2e2c9bb2e3911c816dee320e78cef132e
      KITABCHA_BUILD_VERSION: v3.7.203
      EXPO_PUBLIC_API_URL: http://localhost:3001
      SPECS: ${{ matrix.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: f73a09a2e2c9bb2e3911c816dee320e78cef132e
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          fetch-depth: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install browser validation dependencies
        run: >-
          npm ci --include=dev --no-audit --no-fund >
          "$RUNNER_TEMP/browser-install.log" 2>&1

          npm run db:generate > "$RUNNER_TEMP/browser-prisma.log" 2>&1
      - name: Validate plans, owner dashboard, permissions and existing browser flows
        run: >
          set -euo pipefail

          npx playwright install --with-deps chromium >
          "$RUNNER_TEMP/validation-browser-install.log" 2>&1

          EXPO_PUBLIC_API_URL=http://localhost:3001 GITHUB_SHA="$SOURCE_SHA" npm
          run build:web > "$RUNNER_TEMP/validation-web.log" 2>&1

          for spec in $SPECS; do
            echo "Checking $spec in an isolated test server."
            if ! npx playwright test "tests/e2e/$spec.spec.ts" > "$RUNNER_TEMP/validation-browser.log" 2>&1; then
              echo "Browser gate failed: $spec; private details retained on runner."
              exit 1
            fi
          done

          echo 'Owner notifications, invoice links, team access and expiry
          browser checks passed.'
  unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CI: "1"
      SOURCE_SHA: f73a09a2e2c9bb2e3911c816dee320e78cef132e
      DEPLOY_VERSION: v3.7.203
      KITABCHA_BUILD_VERSION: v3.7.203
      EXPO_PUBLIC_API_URL: https://app.kitabcha.app
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: f73a09a2e2c9bb2e3911c816dee320e78cef132e
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          fetch-depth: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Validate private source without publishing logs
        run: |
          set -euo pipefail
          echo "Installing validation dependencies"
          npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/validation-install.log" 2>&1
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/unit-browser-install.log" 2>&1
          echo "Generating database client"
          npm run db:generate > "$RUNNER_TEMP/validation-prisma.log" 2>&1
          echo "Checking types"
          npm run typecheck > "$RUNNER_TEMP/validation-types.log" 2>&1
          echo "Checking lint"
          npm run lint > "$RUNNER_TEMP/validation-lint.log" 2>&1
          for pattern in 'tests/*.test.ts' 'tests/*.test.mjs'; do
            if [[ "$pattern" == *'.test.ts' ]]; then
              command=(node --import tsx --test --test-reporter=tap --test-concurrency=2 --test-timeout=120000)
            else
              command=(node --test --test-reporter=tap)
            fi
            echo "Running $pattern"
            if ! "${command[@]}" $pattern > "$RUNNER_TEMP/validation-tests.log" 2>&1; then
              python3 - <<'PYTEST'
          import pathlib,os,re
          log=pathlib.Path(os.environ['RUNNER_TEMP'],'validation-tests.log').read_text()
          for line in log.splitlines():
           if re.match(r'^\s*(not ok|# (tests|pass|fail|skipped)|error:)',line):print(line[:300])
          PYTEST
              exit 1
            fi
            grep -E '^# (tests|pass|fail|skipped)' "$RUNNER_TEMP/validation-tests.log" || true
          done
          echo 'Types, lint, full API/unit and session/owner/native regressions passed.'
  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: f73a09a2e2c9bb2e3911c816dee320e78cef132e
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
      - name: Verify isolated PostgreSQL backup and restore
        run: >-
          set -euo pipefail

          python3 scripts/verify-postgres-recovery.py >
          "$RUNNER_TEMP/recovery.log" 2>&1

          echo "Isolated PostgreSQL backup and restore gate passed."
on:
  workflow_dispatch: null




