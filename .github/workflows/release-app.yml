name: Read-only reset incident diagnostics
on:
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: production-reset-diagnostics
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 335b698e6640a0df7a173ac54792ea4aeca732ca
      DEPLOY_VERSION: v3.7.87
    steps:
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: 335b698e6640a0df7a173ac54792ea4aeca732ca
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Prepare read-only diagnostic
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/package/deploy"
        printf '%s' '' | base64 -d > "$RUNNER_TEMP/package/investigation.sql"
        printf '%s' 'IyEvdXNyL2Jpbi9lbnYgYmFzaApzZXQgLWV1byBwaXBlZmFpbApjZCAiJChkaXJuYW1lICIkMCIpLy4uIgpkb2NrZXIgZXhlYyAtaSBraXRhYmNoYS1kYi0xIHBzcWwgLVggLVUga2l0YWJjaGEgLWQga2l0YWJjaGEgLUF0IC12IE9OX0VSUk9SX1NUT1A9MSA8IGludmVzdGlnYXRpb24uc3FsCg==' | base64 -d > "$RUNNER_TEMP/package/deploy/release.sh"
        tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/update.tar.gz" -C "$RUNNER_TEMP/package" .
    - name: Publish through restricted receiver
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: |
        export GITHUB_SHA="$SOURCE_SHA"
        set -euo pipefail
        install -m 700 -d ~/.ssh
        trap 'rm -f ~/.ssh/id_ed25519' EXIT
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
        printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
        sum=$(sha256sum "$RUNNER_TEMP/update.tar.gz" | cut -d' ' -f1)
        for attempt in $(seq 1 20); do
          if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "$DEPLOY_VERSION $SOURCE_SHA $sum" < "$RUNNER_TEMP/update.tar.gz" > "$RUNNER_TEMP/receiver.log" 2>&1; then
            cat "$RUNNER_TEMP/receiver.log"
            exit 0
          fi
          cat "$RUNNER_TEMP/receiver.log"
          if ! grep -Eq 'Another CI deployment is running|Another deployment is running' "$RUNNER_TEMP/receiver.log"; then exit 1; fi
          sleep 30
        done
        exit 1
