name: Publish current verified Android download links
permissions:
  contents: read
  actions: read
concurrency:
  group: production-web-v3-release
  cancel-in-progress: false
jobs:
  landing_links:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CI: '1'
      SOURCE_SHA: 1d25eea9542ea77dc76784603f19e8118b9759c9
      DEPLOY_VERSION: v3.7.135
      KITABCHA_BUILD_VERSION: v3.7.135
      EXPO_PUBLIC_API_URL: https://app.kitabcha.app
    steps:
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: 1d25eea9542ea77dc76784603f19e8118b9759c9
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
        fetch-depth: 9
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Build and verify landing download links
      run: "set -euo pipefail\nnpm ci --include=dev --no-audit --no-fund > \"$RUNNER_TEMP/install.log\"\
        \ 2>&1\nnode scripts/build-landing.mjs\nnode --test tests/landing-phone.test.mjs\n\
        node --input-type=module <<'JS'\nimport fs from 'node:fs';\nconst expected=JSON.parse(fs.readFileSync('apps/client/marketing/releases.json')).android.url;\n\
        for(const language of ['', 'fa/', 'ps/']) {\n const html=fs.readFileSync('apps/client/public/landing/'+language+'index.html','utf8');\n\
        \ if(!html.includes(expected))throw Error('Wrong Android link');\n}\nJS\n\
        update=\"$RUNNER_TEMP/package\"\nmkdir -p \"$update/site/landing/fa\" \"$update/site/landing/ps\"\
        \ \"$update/deploy\"\nfor language in '' 'fa/' 'ps/'; do cp \"apps/client/public/landing/${language}index.html\"\
        \ \"$update/site/landing/${language}index.html\"; done\ncp deploy/landing-assets-release.sh\
        \ \"$update/deploy/release.sh\"\nbash -n \"$update/deploy/release.sh\"\ntar\
        \ --mtime=@0 --owner=0 --group=0 --numeric-owner -czf \"$RUNNER_TEMP/update.tar.gz\"\
        \ -C \"$update\" .\n"
    - name: Publish through restricted receiver
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: "export GITHUB_SHA=\"$SOURCE_SHA\"\nset -euo pipefail\ninstall -m 700 -d\
        \ ~/.ssh\ntrap 'rm -f ~/.ssh/id_ed25519' EXIT\nprintf '%s\\n' \"$VPS_SSH_KEY\"\
        \ > ~/.ssh/id_ed25519\nprintf '%s\\n' \"$VPS_KNOWN_HOSTS\" > ~/.ssh/known_hosts\n\
        chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts\nsum=$(sha256sum \"$RUNNER_TEMP/update.tar.gz\"\
        \ | cut -d' ' -f1)\nfor attempt in $(seq 1 20); do\n  if ssh -T -o BatchMode=yes\
        \ -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15\
        \ deploy@\"$VPS_HOST\" \"$DEPLOY_VERSION $SOURCE_SHA $sum\" < \"$RUNNER_TEMP/update.tar.gz\"\
        \ > \"$RUNNER_TEMP/receiver.log\" 2>&1; then\n    cat \"$RUNNER_TEMP/receiver.log\"\
        \n    exit 0\n  fi\n  cat \"$RUNNER_TEMP/receiver.log\"\n  if ! grep -Eq 'Another\
        \ CI deployment is running|Another deployment is running' \"$RUNNER_TEMP/receiver.log\"\
        ; then exit 1; fi\n  sleep 30\ndone\nexit 1\n"
'on':
  workflow_dispatch: null
