name: Release Bahij fonts for Android
on:
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: production-bahij-android
  cancel-in-progress: false
jobs:
  android_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: a45c1aa168000f2b837a4ab6664db30e2e0f3d24
      DEPLOY_VERSION: v3.7.84
    steps:
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: a45c1aa168000f2b837a4ab6664db30e2e0f3d24
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/download-artifact@v4
      with:
        name: Kitabcha-2.0.76-android
        run-id: 39097091955
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/mobile
    - name: Install public page generator dependencies
      run: npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/publication-install.log" 2>&1
    - name: Prepare verified Android publication
      run: |
        set -euo pipefail
        package="$RUNNER_TEMP/package"
        mkdir -p "$package/mobile" "$package/site/landing" "$package/deploy"
        apk="$RUNNER_TEMP/mobile/Kitabcha-2.0.76-android.apk"
        python3 scripts/verify-mobile-release.py "$apk" 2.0.76 73 "$RUNNER_TEMP/mobile/release.json"
        cp "$apk" "$package/mobile/"
        cp "$RUNNER_TEMP/mobile/release.json" "$package/mobile/"
        node --input-type=module <<'JS'
        import fs from 'node:fs';
        const p='apps/client/marketing/releases.json';const d=JSON.parse(fs.readFileSync(p));d.android=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/mobile/release.json'));fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
        JS
        node scripts/build-landing.mjs > "$RUNNER_TEMP/android-landing.log" 2>&1
        cp -r apps/client/public/landing/. "$package/site/landing/"
        cp "$RUNNER_TEMP/mobile/release.json" "$package/site/android-release.json"
        cp deploy/android-assets-release.sh "$package/deploy/release.sh"
        cp deploy/prune-android-downloads.py "$package/deploy/"
        tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/update.tar.gz" -C "$package" .
    - name: Publish through restricted receiver
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: |
        export GITHUB_SHA="$SOURCE_SHA"
        set -euo pipefail
        install -m 700 -d ~/.ssh
        trap 'rm -f ~/.ssh/id_ed25519' EXIT
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
        printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
        sum=$(sha256sum "$RUNNER_TEMP/update.tar.gz" | cut -d' ' -f1)
        for attempt in $(seq 1 20); do
          if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "$DEPLOY_VERSION $SOURCE_SHA $sum" < "$RUNNER_TEMP/update.tar.gz" > "$RUNNER_TEMP/receiver.log" 2>&1; then
            cat "$RUNNER_TEMP/receiver.log"
            exit 0
          fi
          cat "$RUNNER_TEMP/receiver.log"
          if ! grep -Eq 'Another CI deployment is running|Another deployment is running' "$RUNNER_TEMP/receiver.log"; then exit 1; fi
          sleep 30
        done
        exit 1
    - name: Verify published Android APK and latest-only download links
      run: |
        python3 - <<'PY'
        import hashlib,json,os,urllib.request
        expected=json.load(open(os.environ['RUNNER_TEMP']+'/mobile/release.json'))
        actual=json.load(urllib.request.urlopen('https://app.kitabcha.app/android-release.json',timeout=30));assert actual==expected
        with urllib.request.urlopen('https://app.kitabcha.app'+actual['url'],timeout=120) as response: data=response.read()
        assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']
        for route in ['', 'fa/', 'ps/']:
         assert actual['url'] in urllib.request.urlopen('https://kitabcha.app/'+route,timeout=30).read().decode()
        print('Signed Android release and all landing links verified.')
        PY
