name: Promote fully validated Kitabcha release
on:
  workflow_dispatch:
    inputs:
      preflight_run:
        description: Successful complete validation run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production-web-v3-release
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CI: "1"
      SOURCE_SHA: e2af0a0f21c1745d9c5233b0e1ee1e77873553e6
      DEPLOY_VERSION: v3.8.18
      KITABCHA_BUILD_VERSION: v3.8.18
      PREFLIGHT_RUN: ${{ github.event.workflow_run.id || inputs.preflight_run }}
      VALIDATION_DIGEST: b3d8ad4ae8e80e1aaacd95278d401e0bcf9aff2f8178d5233a0a64ce649d0a0c
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: e2af0a0f21c1745d9c5233b0e1ee1e77873553e6
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          fetch-depth: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Verify entire immutable preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify-preflight.mjs
      - uses: actions/download-artifact@v4
        with:
          name: production-e2af0a0f21c1745d9c5233b0e1ee1e77873553e6
          path: ${{ runner.temp }}/production
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.preflight_run }}
      - name: Authenticate production artifact
        env:
          ARTIFACT_SECRET: ${{ secrets.PRIVATE_SOURCE_KEY }}
          ARTIFACT_CONTEXT: xecdev/kitabcha-releases/${{ github.event.workflow_run.id || inputs.preflight_run }}/e2af0a0f21c1745d9c5233b0e1ee1e77873553e6/v3.8.18/dd5c38f28d13e574d427d7e392c5bc1ac4c3a3d6/production
        run: node scripts/release-artifact.mjs open "$RUNNER_TEMP/production/production.enc" "$RUNNER_TEMP/update.tar.gz"
      - name: Confirm production release base
        run: |-
          node --input-type=module <<'NODE'
          const response=await fetch('https://app.kitabcha.app/web-release.json',{cache:'no-store',signal:AbortSignal.timeout(30000)});if(!response.ok)throw Error('Production marker HTTP '+response.status);const current=await response.json();if(current.version!=='v3.8.17'||current.commit!=='dd5c38f28d13e574d427d7e392c5bc1ac4c3a3d6')throw Error('Production changed since preparation');console.log('Production release base confirmed:',current.version,current.commit);
          NODE
      - name: Publish through restricted receiver
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          export GITHUB_SHA="$SOURCE_SHA"
          set -euo pipefail
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          sum=$(sha256sum "$RUNNER_TEMP/update.tar.gz" | cut -d' ' -f1)
          for attempt in $(seq 1 20); do
            if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "$DEPLOY_VERSION $SOURCE_SHA $sum" < "$RUNNER_TEMP/update.tar.gz" > "$RUNNER_TEMP/receiver.log" 2>&1; then
              python3 -c 'import json,sys; allowed={"databasePortsPrivate","apiPortsPrivate","apiNonRoot","apiNoNewPrivileges","apiCapabilitiesDropped","sshPasswordDisabled","sshRootDisabled","hostFirewallActive","fail2banActive","automaticUpdatesActive","backupKeyConfigured","diskFreeBytes","diskTotalBytes"}; [print("Server readiness: "+json.dumps({k:v for k,v in json.loads(line.split("=",1)[1]).items() if k in allowed and (isinstance(v,(bool,int,float)) or v is None)})) for line in open(sys.argv[1]) if line.startswith("KITABCHA_READINESS=")]' "$RUNNER_TEMP/receiver.log"

              grep '^KITABCHA_PHASE=' "$RUNNER_TEMP/receiver.log" || true
              echo 'Receiver status captured privately.'
              exit 0
            fi
            echo 'Receiver status captured privately.'
            if ! grep -Eq 'Another CI deployment is running|Another deployment is running' "$RUNNER_TEMP/receiver.log"; then exit 1; fi
            sleep 30
          done
          exit 1
      - name: Verify web publication
        run: |
          curl --fail --retry 5 https://app.kitabcha.app/web-release.json -o "$RUNNER_TEMP/web-release.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/web-release.json');if(r.commit!==process.env.SOURCE_SHA||r.version!==process.env.DEPLOY_VERSION)process.exit(1);console.log(r)"
          curl --fail --retry 5 https://app.kitabcha.app/health
      - name: Verify Google Play links and retired APK routes
        run: |
          node --input-type=module <<'PLAY'
          const play='https://play.google.com/store/apps/details?id=com.kitabcha.app';
          for(const path of ['/','/fa/','/ps/']) {
           const response=await fetch('https://kitabcha.app'+path,{signal:AbortSignal.timeout(30000)});
           if(response.status!==200)throw Error('Website response');const html=await response.text();
           const badges=[...html.matchAll(/<a[^>]+class="store-badge google-play"[^>]*>/g)].map(x=>x[0]);
           if(badges.length!==2||badges.some(x=>!x.includes('href="'+play+'"')||/\sdownload(?:\s|=|>)/.test(x))||html.includes('.apk'))throw Error('Play button policy');
          }
          for(const host of ['https://kitabcha.app','https://app.kitabcha.app']) for(const path of ['/downloads/android/068936aea2a7/Kitabcha-2.0.126-android.apk','/android-release.json']) {
           const response=await fetch(host+path,{method:'HEAD',signal:AbortSignal.timeout(30000)});if(response.status!==410)throw Error('Legacy download still available');
          }
          console.log('Google Play links and retired APK routes verified.');
          PLAY
      - name: Encrypt private failure diagnostics
        if: failure()
        env:
          DIAGNOSTIC_PUBLIC_KEY: 
        run: |-
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          const logs={};for(const name of fs.readdirSync(process.env.RUNNER_TEMP).filter(n=>n.endsWith('.log'))){const p=path.join(process.env.RUNNER_TEMP,name);if(fs.statSync(p).isFile())logs[name]=fs.readFileSync(p,'utf8').slice(-1500000);}
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(JSON.stringify(logs)),cipher.final()]);
          const sealed={key:publicEncrypt({key:Buffer.from(process.env.DIAGNOSTIC_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'release-${{ github.job }}-diagnostic.enc'),JSON.stringify(sealed));console.log('Private diagnostics encrypted for the local decryption key.');
          NODE
      - name: Upload encrypted diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.job }}-web-${{ strategy.job-index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-${{ github.job }}-diagnostic.enc
          retention-days: 2
          if-no-files-found: ignore
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
