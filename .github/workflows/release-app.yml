name: Increase live Free plan to 50 products per book
permissions:
  contents: read
  actions: read
concurrency:
  group: production-web-v3-release
  cancel-in-progress: false
jobs:
  settings:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: 2165d7627b63c2d5f072adc5956947b61699f1d5
      DEPLOY_VERSION: v3.7.170
    steps:
    - name: Prepare targeted plan settings update
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/package/deploy"

        cat > "$RUNNER_TEMP/package/deploy/release.sh" <<''RELEASE_SCRIPT''

        #!/usr/bin/env bash

        set -Eeuo pipefail

        umask 077

        exec 9>/opt/kitabcha/shared/deploy.lock

        flock -n 9 || { echo ''Another deployment is running''; exit 1; }

        docker exec -i kitabcha-db-1 psql -U kitabcha -d kitabcha -v ON_ERROR_STOP=1 <<''SQL''

        BEGIN;

        UPDATE "PlatformSetting" SET value=jsonb_set(value,''{freeProducts}'',''50''::jsonb), "updatedAt"=now() WHERE id=''commercial'';

        DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM "PlatformSetting" WHERE id=''commercial'' AND value->>''freeProducts''=''50'') THEN RAISE EXCEPTION
        ''Product allowance update did not apply''; END IF; END $$;

        COMMIT;

        SQL

        node_result=$(curl --fail --silent --show-error --max-time 20 https://app.kitabcha.app/api/v1/plans)

        printf ''%s'' "$node_result" | python3 -c ''import json,sys; assert json.load(sys.stdin)["commercial"]["freeProducts"]==50; print("Verified
        live Free plan: 50 products per book")''

        RELEASE_SCRIPT

        chmod +x "$RUNNER_TEMP/package/deploy/release.sh"

        tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/update.tar.gz" -C "$RUNNER_TEMP/package" .

        '
    - name: Publish through restricted receiver
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: "export GITHUB_SHA=\"$SOURCE_SHA\"\nset -euo pipefail\ninstall -m 700 -d ~/.ssh\ntrap 'rm -f ~/.ssh/id_ed25519' EXIT\nprintf '%s\\\
        n' \"$VPS_SSH_KEY\" > ~/.ssh/id_ed25519\nprintf '%s\\n' \"$VPS_KNOWN_HOSTS\" > ~/.ssh/known_hosts\nchmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts\n\
        sum=$(sha256sum \"$RUNNER_TEMP/update.tar.gz\" | cut -d' ' -f1)\nfor attempt in $(seq 1 20); do\n  if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes\
        \ -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@\"$VPS_HOST\" \"$DEPLOY_VERSION $SOURCE_SHA $sum\" < \"$RUNNER_TEMP/update.tar.gz\"\
        \ > \"$RUNNER_TEMP/receiver.log\" 2>&1; then\n    cat \"$RUNNER_TEMP/receiver.log\"\n    exit 0\n  fi\n  cat \"$RUNNER_TEMP/receiver.log\"\
        \n  if ! grep -Eq 'Another CI deployment is running|Another deployment is running' \"$RUNNER_TEMP/receiver.log\"; then exit 1; fi\n  sleep\
        \ 30\ndone\nexit 1\n"
    - name: Verify public allowance
      run: 'curl --fail --silent https://app.kitabcha.app/api/v1/plans | python3 -c ''import json,sys; assert json.load(sys.stdin)["commercial"]["freeProducts"]==50;
        print("Free plan products: 50")'''
'on':
  workflow_dispatch: null
