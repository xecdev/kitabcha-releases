name: Publish verified signed Android artifact
on:
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: production-free-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 36858917efccd76721f8cc901d83650e7d59bcce
      DEPLOY_VERSION: v3.7.3
      KITABCHA_BUILD_VERSION: v3.7.2
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: 36858917efccd76721f8cc901d83650e7d59bcce
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate signed build provenance and recover APK
        run: |-
          set -euo pipefail
          gh api repos/xecdev/kitabcha-releases/actions/runs/38515059258/jobs > "$RUNNER_TEMP/build-jobs.json"
          python3 - <<'PY'
          import json,os
          jobs=json.load(open(os.environ['RUNNER_TEMP']+'/build-jobs.json'))['jobs']
          job=next(j for j in jobs if j['name']=='android')
          for name in ['Verify release identity and signature','actions/upload-artifact@v4']:
           assert any(s['name']==name and s['conclusion']=='success' for s in job['steps']),name
          PY
          mkdir -p "$RUNNER_TEMP/mobile-output"
          gh run download 38515059258 --repo xecdev/kitabcha-releases --name Kitabcha-2.0.59-android --dir "$RUNNER_TEMP/mobile-output"
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'mobile-output/Kitabcha-2.0.59-android.apk'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='fed6e76f4e895954a45a8a8e711708a564b50001e1bb483e98c56d601b8894d6'
          with zipfile.ZipFile(p) as z:
           b=z.read('assets/index.android.bundle')
           for marker in [b'Owner withdrawal',b'Search categories',b'No supplier selected',b'money-input-symbol']:
            assert marker in b,marker
          print('Original signed APK recovered, checksum and expense improvements verified.')
          PY
      - name: Ensure APK verification tools
        run: |-
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
           sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
           yes | "$sdk" --licenses >/dev/null || true
           "$sdk" 'build-tools;36.0.0'
          fi
      - name: Prepare verified distributable files
        run: |
          export GITHUB_SHA="$SOURCE_SHA"
          set -euo pipefail
          package="$RUNNER_TEMP/package"
          mkdir -p "$package/mobile" "$package/site/landing" "$package/deploy"
          apk="$RUNNER_TEMP/mobile-output/Kitabcha-2.0.59-android.apk"
          cp "$apk" "$package/mobile/"
          python3 scripts/verify-mobile-release.py "$apk" 2.0.59 56 "$package/mobile/release.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/package/mobile/release.json'));
          const p='apps/client/marketing/releases.json';const d=JSON.parse(fs.readFileSync(p));d.android=r;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          JS
          node scripts/build-landing.mjs > "$RUNNER_TEMP/landing.log" 2>&1
          cp -r apps/client/public/landing/. "$package/site/landing/"
          cp "$package/mobile/release.json" "$package/site/android-release.json"
          cp deploy/android-assets-release.sh "$package/deploy/release.sh"
          tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/update.tar.gz" -C "$package" .
      - name: Publish through restricted receiver
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: >
          export GITHUB_SHA="$SOURCE_SHA"

          set -euo pipefail

          install -m 700 -d ~/.ssh

          trap 'rm -f ~/.ssh/id_ed25519' EXIT

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          sum=$(sha256sum "$RUNNER_TEMP/update.tar.gz" | cut -d' ' -f1)

          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o
          ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST"
          "$DEPLOY_VERSION $SOURCE_SHA $sum" < "$RUNNER_TEMP/update.tar.gz"
      - name: Verify Android publication
        run: |-
          export GITHUB_SHA="$SOURCE_SHA"
          python3 - <<'PY'
          import json,urllib.request,hashlib,os,pathlib
          expected=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'package/mobile/release.json').read_text())
          actual=json.load(urllib.request.urlopen('https://app.kitabcha.app/android-release.json',timeout=30));assert actual==expected
          apk=urllib.request.urlopen('https://app.kitabcha.app'+actual['url'],timeout=120).read();assert hashlib.sha256(apk).hexdigest()==actual['sha256']
          for route in ['', 'fa/', 'ps/']:
           assert actual['url'] in urllib.request.urlopen('https://kitabcha.app/'+route,timeout=30).read().decode()
          print('Signed Android release and all download links verified.')
          PY
