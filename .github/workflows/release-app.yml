name: Publish multilingual marketing vacancies
on:
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: production-careers-web
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 335b698e6640a0df7a173ac54792ea4aeca732ca
      DEPLOY_VERSION: v3.7.86
    steps:
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: 335b698e6640a0df7a173ac54792ea4aeca732ca
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install public page generator dependencies
      run: npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/publication-install.log" 2>&1
    - name: Prepare careers pages
      run: |
        set -euo pipefail
        node scripts/build-landing.mjs > "$RUNNER_TEMP/careers-build.log" 2>&1
        package="$RUNNER_TEMP/package"
        mkdir -p "$package/site/landing/fa/careers" "$package/site/landing/ps/careers" "$package/site/landing/careers" "$package/deploy"
        for locale in '' 'fa/' 'ps/'; do cp "apps/client/public/landing/${locale}careers/index.html" "$package/site/landing/${locale}careers/index.html"; done
        python3 - "$package" <<'PYSCRIPT'
        from pathlib import Path
        import sys
        source=Path('deploy/web-assets-release.sh').read_text()
        source=source.replace('COPY Caddyfile /etc/caddy/Caddyfile\\n','')
        Path(sys.argv[1],'deploy/release.sh').write_text(source)
        PYSCRIPT
        tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/update.tar.gz" -C "$package" .
    - name: Publish through restricted receiver
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: |
        export GITHUB_SHA="$SOURCE_SHA"
        set -euo pipefail
        install -m 700 -d ~/.ssh
        trap 'rm -f ~/.ssh/id_ed25519' EXIT
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
        printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
        sum=$(sha256sum "$RUNNER_TEMP/update.tar.gz" | cut -d' ' -f1)
        for attempt in $(seq 1 20); do
          if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "$DEPLOY_VERSION $SOURCE_SHA $sum" < "$RUNNER_TEMP/update.tar.gz" > "$RUNNER_TEMP/receiver.log" 2>&1; then
            cat "$RUNNER_TEMP/receiver.log"
            exit 0
          fi
          cat "$RUNNER_TEMP/receiver.log"
          if ! grep -Eq 'Another CI deployment is running|Another deployment is running' "$RUNNER_TEMP/receiver.log"; then exit 1; fi
          sleep 30
        done
        exit 1
    - name: Verify published careers pages
      run: |
        python3 - <<'PY'
        import urllib.request
        for locale in ['', 'fa/', 'ps/']:
            html=urllib.request.urlopen('https://kitabcha.app/'+locale+'careers/',timeout=30).read().decode()
            for ref in ['KTB-MO-001','KTB-MA-002']:
                assert ref in html
                assert 'subject=Application%20-%20'+ref in html
            assert 'No open roles right now.' not in html
        print('Both roles, references and email application links verified in all three languages.')
        PY
