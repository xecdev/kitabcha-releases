name: Release account plans, identity and package renewals (web and Android)
on:
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: production-free-release-resume
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      SOURCE_SHA: b6f28024598ba7040dde0a16dccf1d13b3545e0c
      DEPLOY_VERSION: v3.7.68
      KITABCHA_BUILD_VERSION: v3.7.68
      EXPO_PUBLIC_API_URL: https://app.kitabcha.app
    steps:
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: b6f28024598ba7040dde0a16dccf1d13b3545e0c
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Validate private source without publishing logs
      env:
        VALIDATION_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        echo "Installing validation dependencies"
        npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/validation-install.log" 2>&1
        echo "Generating database client"
        npm run db:generate > "$RUNNER_TEMP/validation-prisma.log" 2>&1
        echo "Checking types"
        npm run typecheck > "$RUNNER_TEMP/validation-types.log" 2>&1
        echo "Checking lint"
        npm run lint > "$RUNNER_TEMP/validation-lint.log" 2>&1
        test "$(git rev-parse HEAD^)" = 1dab2a4881fca2c31c7131ac2fd0fa7e4077389e
        test "$(git diff --name-only HEAD^ HEAD)" = tests/e2e/contact-input-ui.spec.ts
        python3 - <<'PYCHECK'
        import json,os,urllib.request
        req=urllib.request.Request('https://api.github.com/repos/xecdev/kitabcha-releases/actions/jobs/117346970379',headers={'Authorization':'Bearer '+os.environ['VALIDATION_TOKEN'],'Accept':'application/vnd.github+json'})
        job=json.load(urllib.request.urlopen(req))
        assert any(s['name']=='Validate private source without publishing logs' and s['conclusion']=='success' for s in job['steps'])
        print('Reusing successful 361 API and 66 client/session tests; only the contact setup wait test changed.')
        PYCHECK
        node --input-type=module <<'JSVERIFY'
        const response=await fetch('https://api.github.com/repos/xecdev/kitabcha-releases/actions/jobs/117346970379/logs',{headers:{Authorization:'Bearer '+process.env.VALIDATION_TOKEN,Accept:'application/vnd.github+json'}});
        if(!response.ok)throw Error('Previous validation log is unavailable');
        const log=await response.text(), marker='Checking contact-input-ui in an isolated test server.';
        if(!log.includes(marker)||!log.includes('Checking creator-ui in an isolated test server.'))throw Error('Previous browser gates were not reached');
        console.log('Previous loop passed all 14 earlier browser checks; resuming the final contact flow with its setup wait fixed.');
        JSVERIFY
    - name: Validate plans, owner dashboard, permissions and existing browser flows
      run: |
        set -euo pipefail
        npx playwright install --with-deps chromium > "$RUNNER_TEMP/validation-browser-install.log" 2>&1
        EXPO_PUBLIC_API_URL=http://localhost:3001 GITHUB_SHA="$SOURCE_SHA" npm run build:web > "$RUNNER_TEMP/validation-web.log" 2>&1
        for spec in contact-input-ui; do
          echo "Checking $spec in an isolated test server."
          if ! npx playwright test "tests/e2e/$spec.spec.ts" > "$RUNNER_TEMP/validation-browser.log" 2>&1; then
            python3 - <<'PY'
        import re,pathlib,os
        log=re.sub(r'\x1b\[[0-9;]*m','',pathlib.Path(os.environ['RUNNER_TEMP'],'validation-browser.log').read_text())
        for line in log.splitlines():
            if re.match(r'^\s*(Error:|TimeoutError:|Expected:|Received:|Locator:|Test timeout|[0-9]+ failed|[0-9]+ passed|at .*\.spec\.ts:)',line):
                print(re.sub(r'\b[0-9]{6}\b','[redacted]',line)[:500])
        for file in pathlib.Path('test-results').glob('*/error-context.md'):
            text=file.read_text()
            if '```yaml' in text:
                snapshot=text.split('```yaml',1)[1].split('```',1)[0]
                print(re.sub(r'\b[0-9]{6}\b','[redacted]',snapshot)[:10000])
        PY
            exit 1
          fi
        done
        echo 'Owner notifications, invoice links, team access and expiry browser checks passed.'
    - name: Build tested web and API package
      run: |
        set -euo pipefail
        npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
        npm run db:generate > "$RUNNER_TEMP/prisma.log" 2>&1
        GITHUB_SHA="$SOURCE_SHA" npm run build:web > "$RUNNER_TEMP/web-build.log" 2>&1
        update="$RUNNER_TEMP/package"
        mkdir -p "$update/site" "$update/deploy" "$update/apps/api/src" "$update/apps/api/assets" "$update/apps/api/prisma" "$update/packages/domain/src" "$update/node_modules"
        cp -r apps/client/dist/. "$update/site/"
        rm -rf "$update/site/landing" "$update/site/downloads"
        rm -f "$update/site/website-sw.js" "$update/site/android-release.json"
        cp -r apps/api/src/. "$update/apps/api/src/"
        cp apps/api/assets/email-logo.png "$update/apps/api/assets/"
        cp -r packages/domain/src/. "$update/packages/domain/src/"
        cp packages/domain/package.json "$update/packages/domain/"
        node scripts/copy-runtime-deps.mjs "$update" sharp qrcode firebase-admin web-push > "$RUNNER_TEMP/runtime.log" 2>&1
        cp apps/api/package.json "$update/apps/api/"
        cp package-lock.json "$update/"
        cp -r apps/api/prisma/. "$update/apps/api/prisma/"
        cp deploy/commercial-release.sh "$update/deploy/release.sh"
        mkdir -p "$update/site/landing"
        cp -r apps/client/public/landing/. "$update/site/landing/"
        tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/update.tar.gz" -C "$update" .
        echo 'Production package prepared without publishing private source.'
    - name: Publish through restricted receiver
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: |
        export GITHUB_SHA="$SOURCE_SHA"
        set -euo pipefail
        install -m 700 -d ~/.ssh
        trap 'rm -f ~/.ssh/id_ed25519' EXIT
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
        printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
        sum=$(sha256sum "$RUNNER_TEMP/update.tar.gz" | cut -d' ' -f1)
        for attempt in $(seq 1 20); do
          if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "$DEPLOY_VERSION $SOURCE_SHA $sum" < "$RUNNER_TEMP/update.tar.gz" > "$RUNNER_TEMP/receiver.log" 2>&1; then
            cat "$RUNNER_TEMP/receiver.log"
            exit 0
          fi
          cat "$RUNNER_TEMP/receiver.log"
          if ! grep -Eq 'Another CI deployment is running|Another deployment is running' "$RUNNER_TEMP/receiver.log"; then exit 1; fi
          sleep 30
        done
        exit 1
    - name: Verify web publication
      run: |
        curl --fail --retry 5 https://app.kitabcha.app/web-release.json -o "$RUNNER_TEMP/web-release.json"
        node -e "const r=require(process.env.RUNNER_TEMP+'/web-release.json');if(r.commit!==process.env.SOURCE_SHA||r.version!==process.env.DEPLOY_VERSION)process.exit(1);console.log(r)"
        curl --fail --retry 5 https://app.kitabcha.app/health
  android_publish:
    runs-on: ubuntu-latest
    needs:
    - web
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 1dab2a4881fca2c31c7131ac2fd0fa7e4077389e
      DEPLOY_VERSION: v3.7.69
    steps:
    - uses: actions/checkout@v4
      with:
        repository: xecdev/kitabcha-app
        ref: 1dab2a4881fca2c31c7131ac2fd0fa7e4077389e
        ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Wait for the existing signed Android build
      env:
        BUILD_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PYWAIT'
        import json,os,time,urllib.request
        for attempt in range(60):
         req=urllib.request.Request('https://api.github.com/repos/xecdev/kitabcha-releases/actions/jobs/117346970509',headers={'Authorization':'Bearer '+os.environ['BUILD_TOKEN'],'Accept':'application/vnd.github+json'})
         job=json.load(urllib.request.urlopen(req))
         if job['status']=='completed':
          assert job['conclusion']=='success', 'Android build failed'
          print('Existing signed Android build passed; application source is unchanged.')
          break
         time.sleep(20)
        else: raise SystemExit('Android build is not ready')
        PYWAIT
    - uses: actions/download-artifact@v4
      with:
        name: Kitabcha-2.0.72-android
        run-id: 39015599354
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/mobile
    - name: Prepare verified Android publication
      run: |
        set -euo pipefail
        package="$RUNNER_TEMP/package"
        mkdir -p "$package/mobile" "$package/site/landing" "$package/deploy"
        apk="$RUNNER_TEMP/mobile/Kitabcha-2.0.72-android.apk"
        python3 scripts/verify-mobile-release.py "$apk" 2.0.72 69 "$RUNNER_TEMP/mobile/release.json"
        cp "$apk" "$package/mobile/"
        cp "$RUNNER_TEMP/mobile/release.json" "$package/mobile/"
        node --input-type=module <<'JS'
        import fs from 'node:fs';
        const p='apps/client/marketing/releases.json';const d=JSON.parse(fs.readFileSync(p));d.android=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/mobile/release.json'));fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
        JS
        node scripts/build-landing.mjs > "$RUNNER_TEMP/android-landing.log" 2>&1
        cp -r apps/client/public/landing/. "$package/site/landing/"
        cp "$RUNNER_TEMP/mobile/release.json" "$package/site/android-release.json"
        cp deploy/android-assets-release.sh "$package/deploy/release.sh"
        cp deploy/prune-android-downloads.py "$package/deploy/"
        tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/update.tar.gz" -C "$package" .
    - name: Publish through restricted receiver
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: |
        export GITHUB_SHA="$SOURCE_SHA"
        set -euo pipefail
        install -m 700 -d ~/.ssh
        trap 'rm -f ~/.ssh/id_ed25519' EXIT
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
        printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
        sum=$(sha256sum "$RUNNER_TEMP/update.tar.gz" | cut -d' ' -f1)
        for attempt in $(seq 1 20); do
          if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "$DEPLOY_VERSION $SOURCE_SHA $sum" < "$RUNNER_TEMP/update.tar.gz" > "$RUNNER_TEMP/receiver.log" 2>&1; then
            cat "$RUNNER_TEMP/receiver.log"
            exit 0
          fi
          cat "$RUNNER_TEMP/receiver.log"
          if ! grep -Eq 'Another CI deployment is running|Another deployment is running' "$RUNNER_TEMP/receiver.log"; then exit 1; fi
          sleep 30
        done
        exit 1
    - name: Verify published Android APK and latest-only download links
      run: |
        python3 - <<'PY'
        import hashlib,json,os,urllib.request
        expected=json.load(open(os.environ['RUNNER_TEMP']+'/mobile/release.json'))
        actual=json.load(urllib.request.urlopen('https://app.kitabcha.app/android-release.json',timeout=30));assert actual==expected
        with urllib.request.urlopen('https://app.kitabcha.app'+actual['url'],timeout=120) as response: data=response.read()
        assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']
        for route in ['', 'fa/', 'ps/']:
         assert actual['url'] in urllib.request.urlopen('https://kitabcha.app/'+route,timeout=30).read().decode()
        print('Signed Android release and all landing links verified.')
        PY
