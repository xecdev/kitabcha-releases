name: Check public runner package mirrors
on: workflow_dispatch
permissions:
  contents: read
jobs:
  mirrors:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Check alternate signed Ubuntu archives
        run: |
          for base in https://mirrors.edge.kernel.org/ubuntu https://mirror.math.princeton.edu/pub/ubuntu https://mirrors.mit.edu/ubuntu https://ubuntu.osuosl.org/ubuntu; do
            for suite in jammy jammy-updates jammy-security; do
              if curl --fail --silent --show-error --head --connect-timeout 5 --max-time 10 "$base/dists/$suite/InRelease" >/dev/null 2>&1; then echo "$base $suite available"; else echo "$base $suite unavailable"; fi
            done
          done
