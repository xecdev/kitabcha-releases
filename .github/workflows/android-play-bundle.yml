      CCACHE_COMPILERCHECK: content
      KITABCHA_BUILD_VERSION: 2.1.5
      SOURCE_SHA: ${{ inputs.source_ref }}
    steps:
      - name: Require immutable private source SHA
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
      - name: Select reachable signed Ubuntu archive
        run: >
          set -euo pipefail

          mirror=''

          for base in https://mirror.math.princeton.edu/pub/ubuntu https://mirrors.mit.edu/ubuntu
          https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
            if curl --fail --silent --show-error --head --connect-timeout 5 --max-time 15 "$base/dists/jammy/InRelease" >/dev/null 2>&1 && curl --fail --silent --show-error --head --connect-timeout 5 --max-time 15 "$base/dists/jammy-security/InRelease" >/dev/null 2>&1; then
              mirror="$base"
              break
            fi
          done

          test -n "$mirror"

          echo "Selected reachable Ubuntu archive: $mirror"

          sudo python3 - "$mirror" <<'PY'

          from pathlib import Path

          import re, sys

          base = sys.argv[1]

          for path in [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/apt-mirrors-security.txt')]:
              if path.is_file():
                  path.write_text(base + '/\n')
          paths = [Path('/etc/apt/sources.list')]

          paths += list(Path('/etc/apt/sources.list.d').glob('*.list')) + list(Path('/etc/apt/sources.list.d').glob('*.sources'))

          for path in paths:
              if path.is_file():
                  original = path.read_text()
                  updated = re.sub(r'https?://(?:[A-Za-z0-9.-]*archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?', base + '/', original)
                  if updated != original:
                      path.write_text(updated)
          PY

          timeout 240 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update >
          "$RUNNER_TEMP/ubuntu-mirror.log" 2>&1
      - name: Read app version
        id: version
        run: >
