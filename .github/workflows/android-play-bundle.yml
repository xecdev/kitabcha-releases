          # Build on a stable branch; publication still uses an immutable tag.

          test "$GITHUB_REF_TYPE" = branch || { echo 'Dispatch APK builds on the release branch, not a version tag.'; exit 1; }

          node -e "const {expo}=require('./apps/client/app.json'); console.log('version='+expo.version);
          console.log('code='+expo.android.versionCode)" >> "$GITHUB_OUTPUT"

          node <<'JS' >> "$GITHUB_OUTPUT"

          const {createHash}=require('crypto');

          const {expo}=require('./apps/client/app.json');

          delete expo.version;

          delete expo.android.versionCode;

          if(expo.ios) delete expo.ios.buildNumber;

          console.log('native='+createHash('sha256').update(JSON.stringify(expo)).digest('hex'));

