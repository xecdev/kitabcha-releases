name: Build and verify Google Play bundle
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable Kitabcha source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: kitabcha-play-bundle
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: https://app.kitabcha.app
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      KITABCHA_BUILD_VERSION: 2.1.5
      SOURCE_SHA: ${{ inputs.source_ref }}
    steps:
      - name: Require immutable private source SHA
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
      - name: Select reachable signed Ubuntu archive
        run: >
          set -euo pipefail

          mirror=''

          for base in https://mirror.math.princeton.edu/pub/ubuntu https://mirrors.mit.edu/ubuntu
          https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
            if curl --fail --silent --show-error --head --connect-timeout 5 --max-time 15 "$base/dists/jammy/InRelease" >/dev/null 2>&1 && curl --fail --silent --show-error --head --connect-timeout 5 --max-time 15 "$base/dists/jammy-security/InRelease" >/dev/null 2>&1; then
              mirror="$base"
              break
            fi
          done

          test -n "$mirror"

          echo "Selected reachable Ubuntu archive: $mirror"

          sudo python3 - "$mirror" <<'PY'

          from pathlib import Path

          import re, sys

          base = sys.argv[1]

          for path in [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/apt-mirrors-security.txt')]:
              if path.is_file():
                  path.write_text(base + '/\n')
          paths = [Path('/etc/apt/sources.list')]

          paths += list(Path('/etc/apt/sources.list.d').glob('*.list')) + list(Path('/etc/apt/sources.list.d').glob('*.sources'))

          for path in paths:
              if path.is_file():
                  original = path.read_text()
                  updated = re.sub(r'https?://(?:[A-Za-z0-9.-]*archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?', base + '/', original)
                  if updated != original:
                      path.write_text(updated)
          PY

          timeout 240 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update >
          "$RUNNER_TEMP/ubuntu-mirror.log" 2>&1
      - name: Read app version
        id: version
        run: >
          # Tag-scoped caches cannot be reused by the next release tag.

          # Build on a stable branch; publication still uses an immutable tag.

          test "$GITHUB_REF_TYPE" = branch || { echo 'Dispatch APK builds on the release branch, not a version tag.'; exit 1; }

          node -e "const {expo}=require('./apps/client/app.json'); console.log('version='+expo.version);
          console.log('code='+expo.android.versionCode)" >> "$GITHUB_OUTPUT"

          node <<'JS' >> "$GITHUB_OUTPUT"

          const {createHash}=require('crypto');

          const {expo}=require('./apps/client/app.json');

          delete expo.version;

          delete expo.android.versionCode;

          if(expo.ios) delete expo.ios.buildNumber;

          console.log('native='+createHash('sha256').update(JSON.stringify(expo)).digest('hex'));

          JS
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore Gradle dependencies and compiled tasks
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: false
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: android-ccache-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/client/plugins/**', 'apps/client/modules/**')
            }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: >
            android-ccache-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/client/plugins/**',
            'apps/client/modules/**') }}-

            android-ccache-v1-${{ runner.os }}-
      - name: Install native compiler cache
        run: >
          printf '%s\n' 'Acquire::ForceIPv4 "true";' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";'
          'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80kitabcha-network >/dev/null

          sudo apt-get update -qq

          sudo apt-get install --no-install-recommends -y ccache

          ccache --zero-stats
      - name: Install Android SDK components
        run: |
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
          test -n "$sdk"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          (
          npm ci --include=dev --no-audit --no-fund
          node scripts/build-report-renderer.mjs
          node scripts/build-receipt-viewer.mjs
          ) > "$RUNNER_TEMP/android-install-javascript-dependencies.log" 2>&1
          echo "Install JavaScript dependencies passed."
      - name: Check Home swipe behavior and login translations
        run: >
          set -euo pipefail

          (

          node --import tsx --test tests/home-swipe.test.ts tests/back-swipe.test.ts tests/mobile-back.test.ts
          tests/phonebook-contact.test.ts tests/localization.test.ts tests/name-input.test.ts

          ) > "$RUNNER_TEMP/android-check-home-swipe-behavior-and-login-translations.log" 2>&1

          echo "Check Home swipe behavior and login translations passed."
      - name: Verify native notification destinations
        run: node --import tsx --test tests/push-navigation.test.ts tests/scroll-position.test.ts > "$RUNNER_TEMP/push-navigation.log"
          2>&1
      - name: Verify native commerce file and draft adapters
        run: >
          set -euo pipefail

          (

          node --test tests/screen-actions.test.mjs tests/phonebook-native.test.mjs tests/back-swipe-native.test.mjs
          tests/native-commerce.test.mjs tests/native-file-save.test.mjs tests/native-report-bridge.test.mjs
          tests/native-financial-export-query.test.mjs tests/native-number-direction.test.mjs tests/bahij-fonts.test.mjs
          tests/receipt-sharing.test.mjs tests/session-forms.test.mjs tests/native-signature-font.test.mjs

          ) > "$RUNNER_TEMP/android-verify-native-commerce-file-and-draft-adapters.log" 2>&1

          echo "Verify native commerce file and draft adapters passed."
      - name: Verify native scanner adapter
        run: node --test tests/native-barcode-scanner.test.mjs tests/native-barcode-camera.test.mjs tests/android-release.test.mjs
          tests/native-receipt-build.test.mjs > "$RUNNER_TEMP/native-scanner.log" 2>&1
      - name: Verify Android 15 window migration and legacy behavior
        run: >
          set -euo pipefail

          (

          node --test tests/android-window-compat.test.mjs

          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.8/asm-9.8.jar
          --output "$RUNNER_TEMP/asm-9.8.jar"

          echo "876eab6a83daecad5ca67eb9fcabb063c97b5aeb8cf1fca7a989ecde17522051  $RUNNER_TEMP/asm-9.8.jar" | sha256sum --check

          ASM_JAR="$RUNNER_TEMP/asm-9.8.jar" node scripts/verify-android-edge-to-edge.mjs

          ) > "$RUNNER_TEMP/android-window-migration.log" 2>&1

          echo "Android window migration JVM regressions passed."
      - name: Render real Expenses PDFs with PNG logos and flags in all three languages
        run: >-
          set -euo pipefail

          (npx playwright install --with-deps chromium && node --import tsx --test tests/native-financial-renderer.test.ts) >
          "$RUNNER_TEMP/native-pdf-images.log" 2>&1

          echo "Actual Expenses PDFs with PNG logos and currency flags passed in all three languages."
      - name: Generate Android project
        working-directory: apps/client
        run: |
          set -euo pipefail
          (
          npx expo prebuild --platform android --no-install --no-clean
          ) > "$RUNNER_TEMP/android-generate-android-project.log" 2>&1
          echo "Generate Android project passed."
      - name: Restore compiled native dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/**/android/.cxx
            node_modules/**/android/build
            node_modules/react-native/ReactAndroid/.cxx
            node_modules/react-native/ReactAndroid/build
            apps/client/android/app/.cxx
            apps/client/android/app/build/intermediates/cxx
          key: android-native-v1-${{ runner.os }}-${{ steps.version.outputs.native }}-${{ hashFiles('package-lock.json',
            'apps/client/plugins/**', 'apps/client/modules/**') }}-${{ github.run_id }}
          restore-keys: >
            android-native-v1-${{ runner.os }}-${{ steps.version.outputs.native }}-${{ hashFiles('package-lock.json',
            'apps/client/plugins/**', 'apps/client/modules/**') }}-
      - name: Configure release signing
        working-directory: apps/client
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          (
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_PASSWORD"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/kitabcha-signing.p12"
          printf '%s' "$SIGNING_PASSWORD" > "$RUNNER_TEMP/kitabcha-signing-password"
          chmod 600 "$RUNNER_TEMP/kitabcha-signing.p12" "$RUNNER_TEMP/kitabcha-signing-password"
          node <<'JS'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let source = fs.readFileSync(path, 'utf8');
          if (!source.includes('signingConfigs {') || !source.includes('signingConfig signingConfigs.debug')) throw Error('Unexpected Gradle signing configuration');
          source = source.replace('signingConfigs {', `signingConfigs {
                  kitabchaRelease {
                      storeFile file(System.getenv('RUNNER_TEMP') + '/kitabcha-signing.p12')
                      storePassword new File(System.getenv('RUNNER_TEMP') + '/kitabcha-signing-password').text.trim()
                      keyAlias 'kitabcha-test'
                      keyPassword new File(System.getenv('RUNNER_TEMP') + '/kitabcha-signing-password').text.trim()
                  }`);
          source = source.replaceAll('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.kitabchaRelease');
          fs.writeFileSync(path, source);
          // Do not persist configuration-cache data: signing is read at runtime.
          fs.appendFileSync('android/gradle.properties', '\norg.gradle.caching=true\norg.gradle.configuration-cache=false\norg.gradle.workers.max=2\norg.gradle.parallel=true\norg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m\nkotlin.compiler.execution.strategy=in-process\n');
          JS

          ) > "$RUNNER_TEMP/android-configure-release-signing.log" 2>&1
          echo "Configure release signing passed."
      - name: Build signed Play app bundle
        working-directory: apps/client/android
        run: >
          set -euo pipefail

          (

          set -euo pipefail

          start=$SECONDS

          ./gradlew :app:bundleRelease --no-daemon --build-cache --max-workers=2
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

          echo "ANDROID_BUILD_SECONDS=$((SECONDS-start))" >> "$GITHUB_ENV"


          ) > "$RUNNER_TEMP/android-build-signed-aab.log" 2>&1

          echo "Build signed AAB passed."
      - name: Verify R8 did not disable optimization
        run: >
          python3 - <<'PY'

          from pathlib import Path

          p = Path('apps/client/android/app/build/outputs/mapping/release/configuration.txt')

          s = p.read_text()

          assert not any(line.strip() in ('-dontoptimize', '-dontshrink', '-dontobfuscate') for line in s.splitlines()), 'R8
          processing disabled by merged rules'

          assert Path('apps/client/android/app/build/outputs/mapping/release/mapping.txt').stat().st_size > 1000

          print('R8 code optimization, shrinking and obfuscation are enabled in merged release rules.')

          PY
      - name: Native cache statistics
        if: always()
        run: ccache --show-stats
      - name: Verify bundle identity, signature and 16 KB compatibility
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          bundle=apps/client/android/app/build/outputs/bundle/release/app-release.aab
          if ! curl --fail --silent --show-error --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' "https://api.github.com/repos/google/bundletool/releases/assets/329035725?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT" -o "$RUNNER_TEMP/bundletool.jar"; then
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          fi
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle" > "$RUNNER_TEMP/bundle-validation.log" 2>&1
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" --module=base > "$RUNNER_TEMP/bundle-manifest.xml"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle="$bundle" > "$RUNNER_TEMP/bundle-config.json"
          jarsigner -verify "$bundle" > "$RUNNER_TEMP/bundle-signature.txt" 2>&1
          grep -q 'jar verified' "$RUNNER_TEMP/bundle-signature.txt"
          keytool -printcert -jarfile "$bundle" > "$RUNNER_TEMP/bundle-cert.txt"
          python3 scripts/verify-play-bundle.py "$bundle" "$RUNNER_TEMP/bundle-manifest.xml" "$RUNNER_TEMP/bundle-config.json" "$RUNNER_TEMP/bundle-cert.txt"
          mkdir -p "$RUNNER_TEMP/play-output"
          cp "$bundle" "$RUNNER_TEMP/play-output/Kitabcha-${APP_VERSION}-${APP_VERSION_CODE}-play.aab"
          cp "${bundle%.aab}.json" "$RUNNER_TEMP/play-output/Kitabcha-${APP_VERSION}-${APP_VERSION_CODE}-play.json"

          mapping=apps/client/android/app/build/outputs/mapping/release/mapping.txt
          test -s "$mapping"
          cp "$mapping" "$RUNNER_TEMP/play-output/Kitabcha-${APP_VERSION}-${APP_VERSION_CODE}-mapping.txt"
      - name: Verify Play APK generation
        working-directory: apps/client
        run: >
          set -euo pipefail

          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle=android/app/build/outputs/bundle/release/app-release.aab
          --output="$RUNNER_TEMP/play-check.apks" --mode=universal --ks="$RUNNER_TEMP/kitabcha-signing.p12"
          --ks-key-alias=kitabcha-test --ks-pass=file:"$RUNNER_TEMP/kitabcha-signing-password"
          --key-pass=file:"$RUNNER_TEMP/kitabcha-signing-password" > "$RUNNER_TEMP/play-apks.log" 2>&1

          unzip -p "$RUNNER_TEMP/play-check.apks" universal.apk > "$RUNNER_TEMP/play-universal.apk"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RUNNER_TEMP/play-universal.apk"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$RUNNER_TEMP/play-universal.apk"

          echo 'Play-style APK generation and signature/alignment verification passed.'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test the optimized Play APK on Android 7
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 3G
          ram-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          script: python3 scripts/android-play-smoke.py > "$RUNNER_TEMP/optimized-smoke-api24.log" 2>&1
      - name: Smoke-test the optimized Play APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 3G
          ram-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          script: python3 scripts/android-play-smoke.py > "$RUNNER_TEMP/optimized-smoke-api35.log" 2>&1
      - name: Smoke-test the optimized Play APK on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 3G
          ram-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          script: python3 scripts/android-play-smoke.py > "$RUNNER_TEMP/optimized-smoke.log" 2>&1
      - name: Save optimized APK runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimized-play-smoke
          path: ${{ runner.temp }}/play-smoke/*.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Kitabcha-${{ steps.version.outputs.version }}-${{ steps.version.outputs.code }}-play
          path: ${{ runner.temp }}/play-output/*
          if-no-files-found: warn
          retention-days: 30
        if: always()
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/kitabcha-signing.p12" "$RUNNER_TEMP/kitabcha-signing-password"
      - name: Encrypt Android failure diagnostics
        if: failure()
        env:
          DIAGNOSTIC_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtg3UeD8IE9A0fOZ1Oaal
            1pSoJkxstU4Nmi6qZ0qFRkgn5j9Hzm34TqjwEQVRCbujBSipjcdctR6rxToAbk8N
            WhaofmJnVgh8hCUytqi6JTNA2d11Ej/mIgPLwX0dgLdh4yPJsPotHSmolv+4rdcL
            PajxEksQbpaHPqwrkAk6UXhKCxn3dbVeOBNQ/CkIEA+uVF6RvQq8QQU+LN3tqPZg
            pGkJRY5M/ZnAnqe5FTd8M8SkWLbOd/dlu/ffWzZzsyr+bw6DR+PMSR6dE2thjLh+
            AHG0RBX+sSqTA1o6fSMRIn+/Pk3BwvTrPiDVKE5LzSRHzonkcGOXBOFVQkgaBT/w
            kwIDAQAB
            -----END PUBLIC KEY-----
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import{randomBytes,createCipheriv,publicEncrypt,constants}from'node:crypto';
          const names=fs.readdirSync(process.env.RUNNER_TEMP).filter(n=>/^(android-|native-|optimized-|phonebook-|probe-).*\.log$/.test(n));if(!names.length)process.exit(0);const rawLogs=Object.fromEntries(names.map(n=>[n,fs.readFileSync(process.env.RUNNER_TEMP+'/'+n,'utf8')]));
          const raw=Buffer.from(JSON.stringify(rawLogs)),key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv),data=Buffer.concat([cipher.update(raw),cipher.final()]);
          const wrapped=publicEncrypt({key:process.env.DIAGNOSTIC_PUBLIC_KEY,oaepHash:'sha256',padding:constants.RSA_PKCS1_OAEP_PADDING},key);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/android-diagnostic.enc.json',JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')}));
          JS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: encrypted-android-android-diagnostic
          path: ${{ runner.temp }}/android-diagnostic.enc.json
          retention-days: 2
  native_pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
