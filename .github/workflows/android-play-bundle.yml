name: Build and verify current Play bundle and website APK
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable Kitabcha source commit
        required: true
        type: string
      publish_apk:
        description: Publish the verified APK after matching web release succeeds
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kitabcha-play-bundle
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: https://app.kitabcha.app
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      KITABCHA_BUILD_VERSION: 2.0.102
      SOURCE_SHA: ${{ inputs.source_ref }}
    steps:
      - name: Require immutable private source SHA
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - name: Require immutable private source SHA
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
      - name: Read app version
        id: version
        run: >
          # Tag-scoped caches cannot be reused by the next release tag.

          # Build on a stable branch; publication still uses an immutable tag.

          test "$GITHUB_REF_TYPE" = branch || { echo 'Dispatch APK builds on the release branch, not a version tag.';
          exit 1; }

          node -e "const {expo}=require('./apps/client/app.json'); console.log('version='+expo.version);
          console.log('code='+expo.android.versionCode)" >> "$GITHUB_OUTPUT"

          node <<'JS' >> "$GITHUB_OUTPUT"

          const {createHash}=require('crypto');

          const {expo}=require('./apps/client/app.json');

          delete expo.version;

          delete expo.android.versionCode;

          if(expo.ios) delete expo.ios.buildNumber;

          console.log('native='+createHash('sha256').update(JSON.stringify(expo)).digest('hex'));

          JS
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore Gradle dependencies and compiled tasks
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: false
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: android-ccache-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/client/plugins/**',
            'apps/client/modules/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: >
            android-ccache-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/client/plugins/**',
            'apps/client/modules/**') }}-

            android-ccache-v1-${{ runner.os }}-
      - name: Install native compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ccache
          ccache --zero-stats
      - name: Install Android SDK components
        run: |
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
          test -n "$sdk"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          (
          npm ci --include=dev --no-audit --no-fund
          node scripts/build-report-renderer.mjs
          node scripts/build-report-renderer.mjs
          ) > "$RUNNER_TEMP/android-install-javascript-dependencies.log" 2>&1
          echo "Install JavaScript dependencies passed."
      - name: Check Home swipe behavior and login translations
        run: |
          set -euo pipefail
          (
          node --import tsx --test tests/home-swipe.test.ts tests/localization.test.ts
          ) > "$RUNNER_TEMP/android-check-home-swipe-behavior-and-login-translations.log" 2>&1
          echo "Check Home swipe behavior and login translations passed."
      - name: Verify native notification destinations
        run: node --import tsx --test tests/push-navigation.test.ts > "$RUNNER_TEMP/push-navigation.log" 2>&1
      - name: Verify native commerce file and draft adapters
        run: >
          set -euo pipefail

          (

          node --test tests/native-commerce.test.mjs tests/bahij-fonts.test.mjs tests/receipt-sharing.test.mjs
          tests/session-forms.test.mjs

          ) > "$RUNNER_TEMP/android-verify-native-commerce-file-and-draft-adapters.log" 2>&1

          echo "Verify native commerce file and draft adapters passed."
      - name: Verify native scanner adapter
        run: node --test tests/native-barcode-scanner.test.mjs tests/native-barcode-camera.test.mjs
          tests/android-release.test.mjs > "$RUNNER_TEMP/native-scanner.log" 2>&1
      - name: Generate Android project
        working-directory: apps/client
        run: |
          set -euo pipefail
          (
          npx expo prebuild --platform android --no-install --no-clean
          ) > "$RUNNER_TEMP/android-generate-android-project.log" 2>&1
          echo "Generate Android project passed."
      - name: Restore compiled native dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/**/android/.cxx
            node_modules/**/android/build
            node_modules/react-native/ReactAndroid/.cxx
            node_modules/react-native/ReactAndroid/build
            apps/client/android/app/.cxx
            apps/client/android/app/build/intermediates/cxx
          key: android-native-v1-${{ runner.os }}-${{ steps.version.outputs.native }}-${{ hashFiles('package-lock.json',
            'apps/client/plugins/**', 'apps/client/modules/**') }}-${{ github.run_id }}
          restore-keys: >
            android-native-v1-${{ runner.os }}-${{ steps.version.outputs.native }}-${{ hashFiles('package-lock.json',
            'apps/client/plugins/**', 'apps/client/modules/**') }}-
      - name: Configure release signing
        working-directory: apps/client
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          (
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_PASSWORD"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/kitabcha-signing.p12"
          printf '%s' "$SIGNING_PASSWORD" > "$RUNNER_TEMP/kitabcha-signing-password"
          chmod 600 "$RUNNER_TEMP/kitabcha-signing.p12" "$RUNNER_TEMP/kitabcha-signing-password"
          node <<'JS'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let source = fs.readFileSync(path, 'utf8');
          if (!source.includes('signingConfigs {') || !source.includes('signingConfig signingConfigs.debug')) throw Error('Unexpected Gradle signing configuration');
          source = source.replace('signingConfigs {', `signingConfigs {
                  kitabchaRelease {
                      storeFile file(System.getenv('RUNNER_TEMP') + '/kitabcha-signing.p12')
                      storePassword new File(System.getenv('RUNNER_TEMP') + '/kitabcha-signing-password').text.trim()
                      keyAlias 'kitabcha-test'
                      keyPassword new File(System.getenv('RUNNER_TEMP') + '/kitabcha-signing-password').text.trim()
                  }`);
          source = source.replaceAll('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.kitabchaRelease');
          fs.writeFileSync(path, source);
          // Do not persist configuration-cache data: signing is read at runtime.
          fs.appendFileSync('android/gradle.properties', '\norg.gradle.caching=true\norg.gradle.configuration-cache=false\norg.gradle.workers.max=2\norg.gradle.parallel=true\norg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m\nkotlin.compiler.execution.strategy=in-process\n');
          JS

          ) > "$RUNNER_TEMP/android-configure-release-signing.log" 2>&1
          echo "Configure release signing passed."
      - name: Build signed Play app bundle
        working-directory: apps/client/android
        run: >
          set -euo pipefail

          (

          set -euo pipefail

          start=$SECONDS

          ./gradlew :app:bundleRelease --no-daemon --build-cache --max-workers=2
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

          echo "ANDROID_BUILD_SECONDS=$((SECONDS-start))" >> "$GITHUB_ENV"


          ) > "$RUNNER_TEMP/android-build-signed-aab.log" 2>&1

          echo "Build signed AAB passed."
      - name: Verify R8 did not disable optimization
        run: >
          python3 - <<'PY'

          from pathlib import Path

          p = Path('apps/client/android/app/build/outputs/mapping/release/configuration.txt')

          s = p.read_text()

          assert not any(line.strip() in ('-dontoptimize', '-dontshrink', '-dontobfuscate') for line in s.splitlines()),
          'R8 processing disabled by merged rules'

          assert Path('apps/client/android/app/build/outputs/mapping/release/mapping.txt').stat().st_size > 1000

          print('R8 code optimization, shrinking and obfuscation are enabled in merged release rules.')

          PY
      - name: Native cache statistics
        if: always()
        run: ccache --show-stats
      - name: Verify bundle identity, signature and 16 KB compatibility
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >
          set -euo pipefail

          bundle=apps/client/android/app/build/outputs/bundle/release/app-release.aab

          curl --fail --silent --show-error --location --retry 3
          https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o
          "$RUNNER_TEMP/bundletool.jar"

          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle" > "$RUNNER_TEMP/bundle-validation.log"
          2>&1

          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" --module=base >
          "$RUNNER_TEMP/bundle-manifest.xml"

          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle="$bundle" > "$RUNNER_TEMP/bundle-config.json"

          jarsigner -verify "$bundle" > "$RUNNER_TEMP/bundle-signature.txt" 2>&1

          grep -q 'jar verified' "$RUNNER_TEMP/bundle-signature.txt"

          keytool -printcert -jarfile "$bundle" > "$RUNNER_TEMP/bundle-cert.txt"

          python3 scripts/verify-play-bundle.py "$bundle" "$RUNNER_TEMP/bundle-manifest.xml"
          "$RUNNER_TEMP/bundle-config.json" "$RUNNER_TEMP/bundle-cert.txt"

          mkdir -p "$RUNNER_TEMP/play-output"

          cp "$bundle" "$RUNNER_TEMP/play-output/Kitabcha-${APP_VERSION}-${APP_VERSION_CODE}-play.aab"

          cp "${bundle%.aab}.json" "$RUNNER_TEMP/play-output/Kitabcha-${APP_VERSION}-${APP_VERSION_CODE}-play.json"


          mapping=apps/client/android/app/build/outputs/mapping/release/mapping.txt

          test -s "$mapping"

          cp "$mapping" "$RUNNER_TEMP/play-output/Kitabcha-${APP_VERSION}-${APP_VERSION_CODE}-mapping.txt"
      - name: Verify Play APK generation
        working-directory: apps/client
        run: >
          set -euo pipefail

          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks
          --bundle=android/app/build/outputs/bundle/release/app-release.aab --output="$RUNNER_TEMP/play-check.apks"
          --mode=universal --ks="$RUNNER_TEMP/kitabcha-signing.p12" --ks-key-alias=kitabcha-test
          --ks-pass=file:"$RUNNER_TEMP/kitabcha-signing-password"
          --key-pass=file:"$RUNNER_TEMP/kitabcha-signing-password" > "$RUNNER_TEMP/play-apks.log" 2>&1

          unzip -p "$RUNNER_TEMP/play-check.apks" universal.apk > "$RUNNER_TEMP/play-universal.apk"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RUNNER_TEMP/play-universal.apk"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$RUNNER_TEMP/play-universal.apk"

          echo 'Play-style APK generation and signature/alignment verification passed.'
      - name: Enable Android emulator acceleration
        run: >
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee
          /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules

          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test the optimized Play APK on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 3G
          ram-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          script: python3 scripts/android-play-smoke.py > "$RUNNER_TEMP/optimized-smoke.log" 2>&1
      - name: Save optimized APK runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimized-play-smoke
          path: ${{ runner.temp }}/play-smoke/*.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Kitabcha-${{ steps.version.outputs.version }}-${{ steps.version.outputs.code }}-play
          path: ${{ runner.temp }}/play-output/*
          if-no-files-found: warn
          retention-days: 30
        if: always()
      - name: Build signed direct-download APK
        working-directory: apps/client/android
        run: >-
          set -euo pipefail

          ./gradlew :app:assembleRelease --no-daemon --build-cache --max-workers=2
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 > "$RUNNER_TEMP/direct-apk-build.log" 2>&1

          echo "Signed direct-download APK built."
      - name: Verify direct-download APK identity, signature and alignment
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >-
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/mobile-output"

          apk="$RUNNER_TEMP/mobile-output/Kitabcha-${APP_VERSION}-android.apk"

          cp apps/client/android/app/build/outputs/apk/release/app-release.apk "$apk"

          python3 scripts/verify-mobile-release.py "$apk" "$APP_VERSION" "$APP_VERSION_CODE"
          "$RUNNER_TEMP/mobile-output/release.json" > "$RUNNER_TEMP/direct-apk-verification.log" 2>&1

          echo "Direct APK identity, signing certificate, release features and 16 KB alignment verified."
      - uses: actions/upload-artifact@v4
        with:
          name: Kitabcha-${{ steps.version.outputs.version }}-android
          path: ${{ runner.temp }}/mobile-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Build signed direct-download APK
        working-directory: apps/client/android
        run: >-
          set -euo pipefail

          ./gradlew :app:assembleRelease --no-daemon --build-cache --max-workers=2
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 > "$RUNNER_TEMP/direct-apk-build.log" 2>&1

          echo "Signed direct-download APK built."
      - name: Verify direct-download APK identity, signature and alignment
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >-
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/mobile-output"

          apk="$RUNNER_TEMP/mobile-output/Kitabcha-${APP_VERSION}-android.apk"

          cp apps/client/android/app/build/outputs/apk/release/app-release.apk "$apk"

          python3 scripts/verify-mobile-release.py "$apk" "$APP_VERSION" "$APP_VERSION_CODE"
          "$RUNNER_TEMP/mobile-output/release.json" > "$RUNNER_TEMP/direct-apk-verification.log" 2>&1

          echo "Direct APK identity, signing certificate, release features and 16 KB alignment verified."
      - uses: actions/upload-artifact@v4
        with:
          name: Kitabcha-${{ steps.version.outputs.version }}-android
          path: ${{ runner.temp }}/mobile-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/kitabcha-signing.p12" "$RUNNER_TEMP/kitabcha-signing-password"
  android_publish:
    runs-on: ubuntu-latest
    needs:
      - android
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_ref }}
      DEPLOY_VERSION: v3.7.185
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xecdev/kitabcha-app
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_KEY }}
          persist-credentials: false
      - name: Require the matching successful web release
        run: |-
          set -euo pipefail
          curl --fail --silent --show-error https://app.kitabcha.app/web-release.json -o "$RUNNER_TEMP/required-web.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/required-web.json');if(r.commit!==process.env.SOURCE_SHA||r.version!=='v3.7.184')throw Error('Matching web release has not passed deployment gates');"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: Kitabcha-2.0.102-android
          path: ${{ runner.temp }}/mobile
      - name: Install landing build dependencies
        run: npm ci --include=dev --no-audit --no-fund > "$RUNNER_TEMP/publish-install.log" 2>&1
      - name: Prepare verified Android publication
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/package"
          mkdir -p "$package/mobile" "$package/site/landing" "$package/deploy"
          apk="$RUNNER_TEMP/mobile/Kitabcha-2.0.102-android.apk"
          node --input-type=module <<'VERIFY'
          import fs from 'node:fs';import{createHash}from'node:crypto';
          const dir=process.env.RUNNER_TEMP+'/mobile';const r=JSON.parse(fs.readFileSync(dir+'/release.json'));const b=fs.readFileSync(dir+'/Kitabcha-2.0.102-android.apk');
          if(r.version!=='2.0.102'||r.versionCode!==98||r.bytes!==b.length||r.sha256!==createHash('sha256').update(b).digest('hex'))throw Error('APK verification manifest mismatch');
          VERIFY
          cp "$apk" "$package/mobile/"
          cp "$RUNNER_TEMP/mobile/release.json" "$package/mobile/"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p='apps/client/marketing/releases.json';const d=JSON.parse(fs.readFileSync(p));d.android=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/mobile/release.json'));fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          JS
          node scripts/build-landing.mjs > "$RUNNER_TEMP/android-landing.log" 2>&1
          cp -r apps/client/public/landing/. "$package/site/landing/"
          cp "$RUNNER_TEMP/mobile/release.json" "$package/site/android-release.json"
          cp deploy/android-assets-release.sh "$package/deploy/release.sh"
          cp deploy/prune-android-downloads.py "$package/deploy/"
          tar --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/update.tar.gz" -C "$package" .
      - name: Publish through restricted receiver
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: >
          export GITHUB_SHA="$SOURCE_SHA"

          set -euo pipefail

          install -m 700 -d ~/.ssh

          trap 'rm -f ~/.ssh/id_ed25519' EXIT

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          sum=$(sha256sum "$RUNNER_TEMP/update.tar.gz" | cut -d' ' -f1)

          for attempt in $(seq 1 20); do
            if ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 deploy@"$VPS_HOST" "$DEPLOY_VERSION $SOURCE_SHA $sum" < "$RUNNER_TEMP/update.tar.gz" > "$RUNNER_TEMP/receiver.log" 2>&1; then
              echo 'Receiver status captured privately.'
              exit 0
            fi
            echo 'Receiver status captured privately.'
            if ! grep -Eq 'Another CI deployment is running|Another deployment is running' "$RUNNER_TEMP/receiver.log"; then exit 1; fi
            sleep 30
          done

          exit 1
      - name: Verify published Android APK and latest-only download links
        run: >
          python3 - <<'PY'

          import hashlib,json,os,urllib.request

          expected=json.load(open(os.environ['RUNNER_TEMP']+'/mobile/release.json'))

          actual=json.load(urllib.request.urlopen('https://app.kitabcha.app/android-release.json',timeout=30));assert
          actual==expected

          with urllib.request.urlopen('https://app.kitabcha.app'+actual['url'],timeout=120) as response:
          data=response.read()

          assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']

          for route in ['', 'fa/', 'ps/']:
           assert actual['url'] in urllib.request.urlopen('https://kitabcha.app/'+route,timeout=30).read().decode()
          print('Signed Android release and all landing links verified.')

          PY
    if: ${{ inputs.publish_apk }}
    concurrency:
      group: production-web-v3-release
      cancel-in-progress: false
